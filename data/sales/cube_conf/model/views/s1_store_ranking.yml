views:
  - name: store_ranking
    description: "Store ranking with 10-day filter (eligibility at store-month level)"
    cubes:
      # Fact measures needed
      - join_path: fact_sales
        includes:
          - total_receipts
          - total_units_sold
          - active_days        
          - avg_sales_per_day 

      # Date dims (needed to form store-month grain for the 10-day rule)
      - join_path: fact_sales.dim_date
        prefix: true
        includes:
          - year
          - month
          - date

      # Store dims (needed for ranking + district filter)
      - join_path: fact_sales.dim_store
        prefix: true
        includes:
          - store_key
          - store_name
          - sales_district
          - city
          - state
          - sales_manager
