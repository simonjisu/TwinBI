views:
  - name: view_product_performance
    description: "Product performance view for BI (fact_sales + product + date)"
    cubes:
      # 1) 기준 join path: fact
      - join_path: fact_sales
        includes:
          # measures (fact_sales에 정의된 measure 이름을 넣어)
          - total_receipts
          - active_stores
          - total_units_sold
          - total_transactions

      # 2) product dimension들
      - join_path: fact_sales.dim_product
        prefix: true
        includes:
          - marketing_group
          - department
          - category
          - type
          - brand
          - product_name

      # 3) date dimension들 (time hierarchy)
      - join_path: fact_sales.dim_date
        prefix: true
        includes:
          - date
          - year
          - quarter
          - month
          - week