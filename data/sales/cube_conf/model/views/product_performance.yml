views:
  - name: view_product_performance
    description: "Product performance view for BI (fact_sales + product + date)"
    cubes:
      # 1) Base join path: fact
      - join_path: fact_sales
        includes:
          # measures (use the measure names defined in fact_sales)
          - total_receipts
          - active_stores
          - total_units_sold
          - total_transactions

      # 2) Product dimensions
      - join_path: fact_sales.dim_product
        prefix: true
        includes:
          - marketing_group
          - department
          - category
          - type
          - brand
          - product_name

      # 3) Date dimensions (time hierarchy)
      - join_path: fact_sales.dim_date
        prefix: true
        includes:
          - date
          - year
          - quarter
          - month
          - week
