cubes:
  - name: fact_sales
    sql_table: main.fact_sales
    data_source: default

    joins:
      - name: dim_date
        relationship: many_to_one
        sql: "{CUBE}.date_key = {dim_date}.date_key"

      - name: dim_store
        relationship: many_to_one
        sql: "{CUBE}.store_key = {dim_store}.store_key"

      - name: dim_product
        relationship: many_to_one
        sql: "{CUBE}.product_key = {dim_product}.product_key"

    measures:
      - name: total_units_sold
        sql: "units_sold"
        type: sum
      - name: total_sales_amount
        sql: "total_receipts"
        type: sum
      - name: average_unit_price
        sql: "unit_price"
        type: avg
      - name: total_transactions
        sql: sale_id
        type: count
      - name: average_order_value
        type: number
        sql: "SUM(${CUBE}.total_receipts) * 1.0 / NULLIF(COUNT(${CUBE}.sale_id), 0)"
      - name: unique_products_sold
        sql: product_key
        type: count_distinct
      - name: active_stores
        sql: store_key
        type: count_distinct
      - name: active_days
        sql: date_key
        type: count_distinct
      - name: sales_per_store
        type: number
        sql: "SUM(${CUBE}.total_receipts) * 1.0 / NULLIF(COUNT(DISTINCT ${CUBE}.store_key), 0)"
      - name: sales_per_day
        type: number
        sql: "SUM(${CUBE}.total_receipts) * 1.0 / NULLIF(COUNT(DISTINCT ${CUBE}.date_key), 0)"
      - name: revenue_per_unit
        type: number
        sql: "SUM(${CUBE}.total_receipts) * 1.0 / NULLIF(SUM(${CUBE}.units_sold), 0)"

    dimensions:
      - name: sale_id
        sql: "sale_id"
        type: number
        primary_key: true
      - name: product_key
        sql: "product_key"
        type: number
      - name: store_key
        sql: "store_key"
        type: number
      - name: date_key
        sql: "date_key"
        type: number
      

  - name: dim_date
    sql_table: main.dim_date
    dimensions:
      - name: date_key
        sql: "date_key"
        type: number
        primary_key: true
      - name: date
        sql: "date"
        type: time
      - name: month
        sql: "month"
        type: number
      - name: quarter
        sql: "quarter"
        type: number
      - name: year
        sql: "year"
        type: number
      - name: week
        sql: "week"
        type: number

  - name: dim_store
    sql_table: main.dim_store
    dimensions:
      - name: store_key
        sql: "store_key"
        type: number
        primary_key: true
      - name: store_name
        sql: "store_name"
        type: string
      - name: sales_manager
        sql: "sales_manager"
        type: string
      - name: sales_district
        sql: "sales_district"
        type: string
      - name: city
        sql: "city"
        type: string
      - name: state
        sql: "state"
        type: string

  - name: dim_product
    sql_table: main.dim_product
    dimensions:
      - name: product_key
        sql: "product_key"
        type: number
        primary_key: true
      - name: category
        sql: "category"
        type: string
      - name: department
        sql: "department"
        type: string
      - name: type
        sql: "type"
        type: string
      - name: marketing_group
        sql: "marketing_group"
        type: string
      - name: brand
        sql: "brand"
        type: string
      - name: product_name
        sql: "product_name"
        type: string