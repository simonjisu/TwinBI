cubes:
  - name: customer
    sql_table: main.customer
    data_source: default

    joins:
      - name: customer_address
        relationship: many_to_one
        sql: "{CUBE}.c_current_addr_sk = {customer_address}.ca_address_sk"

      - name: customer_demographics
        relationship: many_to_one
        sql: "{CUBE}.c_current_cdemo_sk = {customer_demographics}.cd_demo_sk"

      - name: household_demographics
        relationship: many_to_one
        sql: "{CUBE}.c_current_hdemo_sk = {household_demographics}.hd_demo_sk"

      - name: date_dim
        relationship: many_to_one
        sql: "{CUBE}.c_first_shipto_date_sk = {date_dim}.d_date_sk"

      - name: date_dim
        relationship: many_to_one
        sql: "{CUBE}.c_first_sales_date_sk = {date_dim}.d_date_sk"

      - name: date_dim
        relationship: many_to_one
        sql: "{CUBE}.c_last_review_date_sk = {date_dim}.d_date_sk"

    dimensions:
      - name: c_customer_sk
        sql: c_customer_sk
        type: number
        primary_key: true

      - name: c_birth_country
        sql: c_birth_country
        type: string

      - name: c_birth_day
        sql: c_birth_day
        type: number

      - name: c_birth_month
        sql: c_birth_month
        type: number

      - name: c_birth_year
        sql: c_birth_year
        type: number

      - name: c_customer_id
        sql: c_customer_id
        type: string

      - name: c_current_addr_sk
        sql: c_current_addr_sk
        type: number

      - name: c_current_cdemo_sk
        sql: c_current_cdemo_sk
        type: number

      - name: c_current_hdemo_sk
        sql: c_current_hdemo_sk
        type: number

      - name: c_email_address
        sql: c_email_address
        type: string

      - name: c_first_sales_date_sk
        sql: c_first_sales_date_sk
        type: number

      - name: c_first_shipto_date_sk
        sql: c_first_shipto_date_sk
        type: number

      - name: c_first_name
        sql: c_first_name
        type: string

      - name: c_last_name
        sql: c_last_name
        type: string

      - name: c_login
        sql: c_login
        type: string

      - name: c_preferred_cust_flag
        sql: c_preferred_cust_flag
        type: string

      - name: c_salutation
        sql: c_salutation
        type: string

      - name: c_last_review_date_sk
        sql: c_last_review_date_sk
        type: number

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
