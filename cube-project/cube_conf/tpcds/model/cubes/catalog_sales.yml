cubes:
  - name: catalog_sales
    sql_table: main.catalog_sales
    data_source: default

    joins:
      # [sold] catalog_sales -> date_dim
      - name: date_dim_sold
        relationship: many_to_one
        sql: "{CUBE}.cs_sold_date_sk = {date_dim_sold}.d_date_sk"

      # catalog_sales -> time_dim
      - name: time_dim
        relationship: many_to_one
        sql: "{CUBE}.cs_sold_time_sk = {time_dim}.t_time_sk"

      # [bill] catalog_sales -> customer -> customer_demographics, household_demographics, customer_address, date_dim
      - name: customer_bill
        relationship: many_to_one
        sql: "{CUBE}.cs_bill_customer_sk = {customer_bill}.c_customer_sk"

      # [bill] catalog_sales -> customer_demographics
      - name: customer_demographics_bill
        relationship: one_to_one
        sql: "{CUBE}.cs_bill_cdemo_sk = {customer_demographics_bill}.cd_demo_sk"

      # [bill] catalog_sales -> household_demographics
      - name: household_demographics_bill
        relationship: many_to_one
        sql: "{CUBE}.cs_bill_hdemo_sk = {household_demographics_bill}.hd_demo_sk"

      # [bill] catalog_sales -> customer_address
      - name: customer_address_bill
        relationship: many_to_one
        sql: "{CUBE}.cs_bill_addr_sk = {customer_address_bill}.ca_address_sk"

      # [ship] catalog_sales -> date_dim
      - name: date_dim_ship
        relationship: many_to_one
        sql: "{CUBE}.cs_ship_date_sk = {date_dim_ship}.d_date_sk"

      # [ship] catalog_sales -> customer -> customer_demographics, household_demographics, customer_address, date_dim
      - name: customer_ship
        relationship: many_to_one
        sql: "{CUBE}.cs_ship_customer_sk = {customer_ship}.c_customer_sk"
      
      # [ship] catalog_sales -> customer_demographics
      - name: customer_demographics_ship
        relationship: many_to_one
        sql: "{CUBE}.cs_ship_cdemo_sk = {customer_demographics_ship}.cd_demo_sk"

      # [ship] catalog_sales -> household_demographics
      - name: household_demographics_ship
        relationship: many_to_one
        sql: "{CUBE}.cs_ship_hdemo_sk = {household_demographics_ship}.hd_demo_sk"

      # [ship] catalog_sales -> customer_address
      - name: customer_address_ship
        relationship: one_to_one
        sql: "{CUBE}.cs_ship_addr_sk = {customer_address_ship}.ca_address_sk"

      # catalog_sales -> call_center -> date_dim
      - name: call_center
        relationship: many_to_one
        sql: "{CUBE}.cs_call_center_sk = {call_center}.cc_call_center_sk"
      
      # catalog_sales -> catalog_page -> date_dim
      - name: catalog_page
        relationship: many_to_one
        sql: "{CUBE}.cs_catalog_page_sk = {catalog_page}.cp_catalog_page_sk"

      # catalog_sales -> ship_mode
      - name: ship_mode
        relationship: many_to_one
        sql: "{CUBE}.cs_ship_mode_sk = {ship_mode}.sm_ship_mode_sk"

      # catalog_sales -> warehouse
      - name: warehouse
        relationship: many_to_one
        sql: "{CUBE}.cs_warehouse_sk = {warehouse}.w_warehouse_sk"

      # catalog_sales -> promotion -> item, date_dim
      - name: promotion
        relationship: many_to_one
        sql: "{CUBE}.cs_promo_sk = {promotion}.p_promo_sk"

      # catalog_sales -> item
      - name: item
        relationship: many_to_one
        sql: "{CUBE}.cs_item_sk = {item}.i_item_sk"

    dimensions:
      - name: cs_item_sk
        sql: cs_item_sk
        type: number
        primary_key: true
      
      - name: cs_sold_date_sk
        sql: cs_sold_date_sk
        type: number

      - name: cs_sold_time_sk
        sql: cs_sold_time_sk
        type: number

      - name: cs_ship_date_sk
        sql: cs_ship_date_sk
        type: number

      - name: cs_bill_customer_sk
        sql: cs_bill_customer_sk
        type: number

      - name: cs_bill_cdemo_sk
        sql: cs_bill_cdemo_sk
        type: number

      - name: cs_bill_hdemo_sk
        sql: cs_bill_hdemo_sk
        type: number

      - name: cs_bill_addr_sk
        sql: cs_bill_addr_sk
        type: number

      - name: cs_ship_customer_sk
        sql: cs_ship_customer_sk
        type: number

      - name: cs_ship_cdemo_sk
        sql: cs_ship_cdemo_sk
        type: number

      - name: cs_ship_hdemo_sk
        sql: cs_ship_hdemo_sk
        type: number

      - name: cs_ship_addr_sk
        sql: cs_ship_addr_sk
        type: number

      - name: cs_call_center_sk
        sql: cs_call_center_sk
        type: number

      - name: cs_catalog_page_sk
        sql: cs_catalog_page_sk
        type: number

      - name: cs_ship_mode_sk
        sql: cs_ship_mode_sk
        type: number

      - name: cs_warehouse_sk
        sql: cs_warehouse_sk
        type: number

      - name: cs_promo_sk
        sql: cs_promo_sk
        type: number

      - name: cs_order_number
        sql: cs_order_number
        type: number

      - name: cs_quantity
        sql: cs_quantity
        type: number

      - name: cs_wholesale_cost
        sql: cs_wholesale_cost
        type: number

      - name: cs_list_price
        sql: cs_list_price
        type: number

      - name: cs_sales_price
        sql: cs_sales_price
        type: number

      - name: cs_ext_discount_amt
        sql: cs_ext_discount_amt
        type: number

      - name: cs_ext_sales_price
        sql: cs_ext_sales_price
        type: number

      - name: cs_ext_wholesale_cost
        sql: cs_ext_wholesale_cost
        type: number

      - name: cs_ext_list_price
        sql: cs_ext_list_price
        type: number

      - name: cs_ext_tax
        sql: cs_ext_tax
        type: number

      - name: cs_coupon_amt
        sql: cs_coupon_amt
        type: number

      - name: cs_ext_ship_cost
        sql: cs_ext_ship_cost
        type: number

      - name: cs_net_paid
        sql: cs_net_paid
        type: number

      - name: cs_net_paid_inc_tax
        sql: cs_net_paid_inc_tax
        type: number

      - name: cs_net_paid_inc_ship
        sql: cs_net_paid_inc_ship
        type: number

      - name: cs_net_paid_inc_ship_tax
        sql: cs_net_paid_inc_ship_tax
        type: number

      - name: cs_net_profit
        sql: cs_net_profit
        type: number

    measures:
      - name: count
        type: count

      - name: ext_list_price
        sql: cs_ext_list_price
        type: sum

      - name: ext_sales_price
        sql: cs_ext_sales_price
        type: sum

      - name: ext_ship_cost
        sql: cs_ext_ship_cost
        type: sum

      - name: ext_wholesale_cost
        sql: cs_ext_wholesale_cost
        type: sum

      - name: list_price
        sql: cs_list_price
        type: sum

      - name: order_number
        sql: cs_order_number
        type: sum

      - name: quantity
        sql: cs_quantity
        type: sum

      - name: sales_price
        sql: cs_sales_price
        type: sum

      - name: wholesale_cost
        sql: cs_wholesale_cost
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
