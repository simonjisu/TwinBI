cubes:
  - name: web_returns
    sql_table: main.web_returns
    data_source: default

    joins:
      # web_returns -> date_dim
      - name: date_dim
        relationship: many_to_one
        sql: "{CUBE}.wr_returned_date_sk = {date_dim}.d_date_sk"

      # web_returns -> time_dim
      - name: time_dim
        relationship: many_to_one
        sql: "{CUBE}.wr_returned_time_sk = {time_dim}.t_time_sk"

      # web_returns -> item
      - name: item
        relationship: many_to_one
        sql: "{CUBE}.wr_item_sk = {item}.i_item_sk"

      # [refunded] web_returns -> customer -> customer_demographics, household_demographics, customer_address, date_dim
      - name: customer_refunded
        relationship: many_to_one
        sql: "{CUBE}.wr_refunded_customer_sk = {customer_refunded}.c_customer_sk"

      # [refunded] web_returns -> customer_demographics
      - name: customer_demographics_refunded
        relationship: one_to_one
        sql: "{CUBE}.wr_refunded_cdemo_sk = {customer_demographics_refunded}.cd_demo_sk"

      # [refunded] web_returns -> household_demographics
      - name: household_demographics_refunded
        relationship: many_to_one
        sql: "{CUBE}.wr_refunded_hdemo_sk = {household_demographics_refunded}.hd_demo_sk"

      # [refunded] web_returns -> customer_address
      - name: customer_address_refunded
        relationship: many_to_one
        sql: "{CUBE}.wr_refunded_addr_sk = {customer_address_refunded}.ca_address_sk"

      # [returning] web_returns -> customer -> customer_demographics, household_demographics, customer_address, date_dim
      - name: customer_returning
        relationship: many_to_one
        sql: "{CUBE}.wr_returning_customer_sk = {customer_returning}.c_customer_sk"

      # [returning] web_returns -> customer_demographics
      - name: customer_demographics_returning
        relationship: many_to_one
        sql: "{CUBE}.wr_returning_cdemo_sk = {customer_demographics_returning}.cd_demo_sk"

      # [returning] web_returns -> household_demographics
      - name: household_demographics_returning
        relationship: many_to_one
        sql: "{CUBE}.wr_returning_hdemo_sk = {household_demographics_returning}.hd_demo_sk"

      # [returning] web_returns -> customer_address
      - name: customer_address_returning
        relationship: one_to_one
        sql: "{CUBE}.wr_returning_addr_sk = {customer_address_returning}.ca_address_sk"

      # web_returns -> ship_mode
      - name: ship_mode
        relationship: many_to_one
        sql: "{CUBE}.wr_ship_mode_sk = {ship_mode}.sm_ship_mode_sk"

      # web_returns -> warehouse
      - name: warehouse
        relationship: many_to_one
        sql: "{CUBE}.wr_warehouse_sk = {warehouse}.w_warehouse_sk"

      # web_returns -> reason
      - name: reason
        relationship: many_to_one
        sql: "{CUBE}.wr_reason_sk = {reason}.r_reason_sk"

      # web_returns -> web_page -> date_dim, customer
      - name: web_page
        relationship: many_to_one
        sql: "{CUBE}.wr_web_page_sk = {web_page}.wp_web_page_sk"

      # web_returns -> web_sales
      - name: web_sales
        relationship: many_to_one
        sql: "{CUBE}.wr_order_number = {web_sales}.ws_order_number"

    dimensions:
      - name: wr_item_sk
        sql: wr_item_sk
        type: number
        primary_key: true
      
      - name: wr_returned_date_sk
        sql: wr_returned_date_sk
        type: number

      - name: wr_returned_time_sk
        sql: wr_returned_time_sk
        type: number

      - name: wr_refunded_customer_sk
        sql: wr_refunded_customer_sk
        type: number

      - name: wr_refunded_cdemo_sk
        sql: wr_refunded_cdemo_sk
        type: number

      - name: wr_refunded_hdemo_sk
        sql: wr_refunded_hdemo_sk
        type: number

      - name: wr_refunded_addr_sk
        sql: wr_refunded_addr_sk
        type: number

      - name: wr_returning_customer_sk
        sql: wr_returning_customer_sk
        type: number

      - name: wr_returning_cdemo_sk
        sql: wr_returning_cdemo_sk
        type: number

      - name: wr_returning_hdemo_sk
        sql: wr_returning_hdemo_sk
        type: number

      - name: wr_returning_addr_sk
        sql: wr_returning_addr_sk
        type: number

      - name: wr_web_page_sk
        sql: wr_web_page_sk
        type: number

      - name: wr_reason_sk
        sql: wr_reason_sk
        type: number

      - name: wr_order_number
        sql: wr_order_number
        type: number

      - name: wr_return_quantity
        sql: wr_return_quantity
        type: number

      - name: wr_return_amt
        sql: wr_return_amt
        type: number

      - name: wr_return_tax
        sql: wr_return_tax
        type: number

      - name: wr_return_amt_inc_tax
        sql: wr_return_amt_inc_tax
        type: number

      - name: wr_fee
        sql: wr_fee
        type: number

      - name: wr_return_ship_cost
        sql: wr_return_ship_cost
        type: number

      - name: wr_refunded_cash
        sql: wr_refunded_cash
        type: number

      - name: wr_reversed_charge
        sql: wr_reversed_charge
        type: number

      - name: wr_account_credit
        sql: wr_account_credit
        type: number

      - name: wr_net_loss
        sql: wr_net_loss
        type: number

    measures:
      - name: count
        type: count

      - name: order_number
        sql: wr_order_number
        type: sum

      - name: return_amount
        sql: wr_return_amt
        type: sum

      - name: return_quantity
        sql: wr_return_quantity
        type: sum

      - name: return_ship_cost
        sql: wr_return_ship_cost
        type: sum

      - name: return_tax
        sql: wr_return_tax
        type: sum

      - name: fee
        sql: wr_fee
        type: sum

      - name: refunded_cash
        sql: wr_refunded_cash
        type: sum

      - name: reversed_charge
        sql: wr_reversed_charge
        type: sum

      - name: account_credit
        sql: wr_account_credit
        type: sum

      - name: net_loss
        sql: wr_net_loss
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
