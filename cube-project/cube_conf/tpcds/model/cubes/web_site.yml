cubes:
  - name: web_site
    sql_table: main.web_site
    data_source: default

    joins:
      - name: date_dim_closed_date
        relationship: many_to_one
        sql: "{CUBE}.web_open_date_sk = {date_dim_closed_date}.d_date_sk"

      - name: date_dim_open_date
        relationship: many_to_one
        sql: "{CUBE}.web_close_date_sk = {date_dim_open_date}.d_date_sk"

    dimensions:
      - name: web_site_sk
        sql: web_site_sk
        type: number
        primary_key: true

      - name: web_city
        sql: web_city
        type: string

      - name: web_class
        sql: web_class
        type: string

      - name: web_company_name
        sql: web_company_name
        type: string

      - name: web_company_id
        sql: web_company_id
        type: number

      - name: web_country
        sql: web_country
        type: string

      - name: web_county
        sql: web_county
        type: string

      - name: web_manager
        sql: web_manager
        type: string

      - name: web_market_manager
        sql: web_market_manager
        type: string

      - name: web_mkt_class
        sql: web_mkt_class
        type: string

      - name: web_mkt_desc
        sql: web_mkt_desc
        type: string

      - name: web_mkt_id
        sql: web_mkt_id
        type: number

      - name: web_name
        sql: web_name
        type: string

      - name: web_open_date_sk
        sql: web_open_date_sk
        type: number

      - name: web_close_date_sk
        sql: web_close_date_sk
        type: number

      - name: web_site_id
        sql: web_site_id
        type: string

      - name: web_state
        sql: web_state
        type: string

      - name: web_street_name
        sql: web_street_name
        type: string

      - name: web_street_number
        sql: web_street_number
        type: string

      - name: web_street_type
        sql: web_street_type
        type: string

      - name: web_suite_number
        sql: web_suite_number
        type: string

      - name: web_zip
        sql: web_zip
        type: string

      - name: web_rec_end_date
        sql: web_rec_end_date
        type: time

      - name: web_rec_start_date
        sql: web_rec_start_date
        type: time

      - name: web_gmt_offset
        sql: web_gmt_offset
        type: number

      - name: web_tax_percentage
        sql: web_tax_percentage
        type: number

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
