cubes:
  - name: reason
    sql_table: main.reason
    data_source: default

    joins: []

    dimensions:
      - name: r_reason_sk
        sql: r_reason_sk
        type: number
        primary_key: true

      - name: r_reason_desc
        sql: r_reason_desc
        type: string

      - name: r_reason_id
        sql: r_reason_id
        type: string

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
