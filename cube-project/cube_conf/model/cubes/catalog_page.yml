cubes:
  - name: catalog_page
    sql_table: main.catalog_page
    data_source: default

    joins:
      - name: date_dim_start_date
        relationship: many_to_one
        sql: "{CUBE}.cp_start_date_sk = {date_dim_start_date}.d_date_sk"

      - name: date_dim_end_date
        relationship: many_to_one
        sql: "{CUBE}.cp_end_date_sk = {date_dim_end_date}.d_date_sk"

    dimensions:
      - name: cp_catalog_page_sk
        sql: cp_catalog_page_sk
        type: number
        primary_key: true

      - name: cp_catalog_page_id
        sql: cp_catalog_page_id
        type: string

      - name: cp_start_date_sk
        sql: cp_start_date_sk
        type: number

      - name: cp_end_date_sk
        sql: cp_end_date_sk
        type: number

      - name: cp_department
        sql: cp_department
        type: string

      - name: cp_description
        sql: cp_description
        type: string

      - name: cp_type
        sql: cp_type
        type: string

      - name: cp_catalog_number
        sql: cp_catalog_number
        type: number

      - name: cp_catalog_page_number
        sql: cp_catalog_page_number
        type: number

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
