cubes:
  - name: web_sales
    sql_table: main.web_sales
    data_source: default

    joins:
      - name: date_dim
        relationship: many_to_one
        sql: "{CUBE}.ws_sold_date_sk = {date_dim}.d_date_sk"

      - name: time_dim
        relationship: many_to_one
        sql: "{CUBE}.ws_sold_time_sk = {time_dim}.t_time_sk"

      - name: date_dim_shipped
        relationship: many_to_one
        sql: "{CUBE}.ws_ship_date_sk = {date_dim_shipped}.d_date_sk"

      - name: item
        relationship: many_to_one
        sql: "{CUBE}.ws_item_sk = {item}.i_item_sk"

      - name: customer_billing
        relationship: many_to_one
        sql: "{CUBE}.ws_bill_customer_sk = {customer_billing}.c_customer_sk"

      - name: customer_address_current
        relationship: many_to_one
        sql: "{customer_billing}.c_current_addr_sk = {customer_address_current}.ca_address_sk"

      - name: customer_demographics_billing
        relationship: many_to_one
        sql: "{CUBE}.ws_bill_cdemo_sk = {customer_demographics_billing}.cd_demo_sk"

      - name: household_demographics_billing
        relationship: many_to_one
        sql: "{CUBE}.ws_bill_hdemo_sk = {household_demographics_billing}.hd_demo_sk"

      - name: customer_address_billing
        relationship: many_to_one
        sql: "{CUBE}.ws_bill_addr_sk = {customer_address_billing}.ca_address_sk"

      - name: customer_shipping
        relationship: many_to_one
        sql: "{CUBE}.ws_ship_customer_sk = {customer_shipping}.c_customer_sk"

      - name: customer_demographics_shipping
        relationship: many_to_one
        sql: "{CUBE}.ws_ship_cdemo_sk = {customer_demographics_shipping}.cd_demo_sk"

      - name: household_demographics_shipping
        relationship: many_to_one
        sql: "{CUBE}.ws_ship_hdemo_sk = {household_demographics_shipping}.hd_demo_sk"

      - name: customer_address_shipping
        relationship: many_to_one
        sql: "{CUBE}.ws_ship_addr_sk = {customer_address_shipping}.ca_address_sk"

      - name: web_page
        relationship: many_to_one
        sql: "{CUBE}.ws_web_page_sk = {web_page}.wp_web_page_sk"

      - name: web_site
        relationship: many_to_one
        sql: "{CUBE}.ws_web_site_sk = {web_site}.web_site_sk"

      - name: ship_mode
        relationship: many_to_one
        sql: "{CUBE}.ws_ship_mode_sk = {ship_mode}.sm_ship_mode_sk"

      - name: warehouse
        relationship: many_to_one
        sql: "{CUBE}.ws_warehouse_sk = {warehouse}.w_warehouse_sk"

      - name: promotion
        relationship: many_to_one
        sql: "{CUBE}.ws_promo_sk = {promotion}.p_promo_sk"

    dimensions:
      - name: ws_item_sk
        sql: ws_item_sk
        type: number
        primary_key: true

      - name: ws_order_number
        sql: ws_order_number
        type: number

      - name: ws_quantity
        sql: ws_quantity
        type: number

      - name: ws_wholesale_cost
        sql: ws_wholesale_cost
        type: number

      - name: ws_list_price
        sql: ws_list_price
        type: number

      - name: ws_sales_price
        sql: ws_sales_price
        type: number

      - name: ws_ext_discount_amt
        sql: ws_ext_discount_amt
        type: number

      - name: ws_ext_sales_price
        sql: ws_ext_sales_price
        type: number

      - name: ws_ext_wholesale_cost
        sql: ws_ext_wholesale_cost
        type: number

      - name: ws_ext_list_price
        sql: ws_ext_list_price
        type: number

      - name: ws_ext_tax
        sql: ws_ext_tax
        type: number

      - name: ws_coupon_amt
        sql: ws_coupon_amt
        type: number

      - name: ws_ext_ship_cost
        sql: ws_ext_ship_cost
        type: number

      - name: ws_net_paid
        sql: ws_net_paid
        type: number

      - name: ws_net_paid_inc_tax
        sql: ws_net_paid_inc_tax
        type: number

      - name: ws_net_paid_inc_ship
        sql: ws_net_paid_inc_ship
        type: number

      - name: ws_net_paid_inc_ship_tax
        sql: ws_net_paid_inc_ship_tax
        type: number

      - name: ws_net_profit
        sql: ws_net_profit
        type: number

    measures:
      - name: count
        type: count

      - name: ext_list_price
        sql: ws_ext_list_price
        type: sum

      - name: ext_sales_price
        sql: ws_ext_sales_price
        type: sum

      - name: ext_ship_cost
        sql: ws_ext_ship_cost
        type: sum

      - name: ext_wholesale_cost
        sql: ws_ext_wholesale_cost
        type: sum

      - name: list_price
        sql: ws_list_price
        type: sum

      - name: order_number
        sql: ws_order_number
        type: sum

      - name: quantity
        sql: ws_quantity
        type: sum

      - name: sales_price
        sql: ws_sales_price
        type: sum

      - name: wholesale_cost
        sql: ws_wholesale_cost
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
