cubes:
  - name: web_sales
    sql_table: main.web_sales
    data_source: default

    joins:
      # [sold] web_sales -> date_dim
      - name: date_dim__sold
        relationship: many_to_one
        sql: "{CUBE}.ws_sold_date_sk = {date_dim__sold}.d_date_sk"

      # web_sales -> time_dim
      - name: time_dim
        relationship: many_to_one
        sql: "{CUBE}.ws_sold_time_sk = {time_dim}.t_time_sk"

      # [bill] web_sales -> customer -> customer_demographics, household_demographics, customer_address, date_dim
      - name: customer__bill
        relationship: many_to_one
        sql: "{CUBE}.ws_bill_customer_sk = {customer__bill}.c_customer_sk"

      # [bill] web_sales -> customer_demographics
      - name: customer_demographics__bill
        relationship: one_to_one
        sql: "{CUBE}.ws_bill_cdemo_sk = {customer_demographics__bill}.cd_demo_sk"

      # [bill] web_sales -> household_demographics
      - name: household_demographics__bill
        relationship: many_to_one
        sql: "{CUBE}.ws_bill_hdemo_sk = {household_demographics__bill}.hd_demo_sk"

      # [bill] web_sales -> customer_address
      - name: customer_address__bill
        relationship: many_to_one
        sql: "{CUBE}.ws_bill_addr_sk = {customer_address__bill}.ca_address_sk"

      # [ship] web_sales -> date_dim
      - name: date_dim__ship
        relationship: many_to_one
        sql: "{CUBE}.ws_ship_date_sk = {date_dim__ship}.d_date_sk"

      # [ship] web_sales -> customer -> customer_demographics, household_demographics, customer_address, date_dim
      - name: customer__ship
        relationship: many_to_one
        sql: "{CUBE}.ws_ship_customer_sk = {customer__ship}.c_customer_sk"
      
      # [ship] web_sales -> customer_demographics
      - name: customer_demographics__ship
        relationship: many_to_one
        sql: "{CUBE}.ws_ship_cdemo_sk = {customer_demographics__ship}.cd_demo_sk"

      # [ship] web_sales -> household_demographics
      - name: household_demographics__ship
        relationship: many_to_one
        sql: "{CUBE}.ws_ship_hdemo_sk = {household_demographics__ship}.hd_demo_sk"

      # [ship] web_sales -> customer_address
      - name: customer_address__ship
        relationship: one_to_one
        sql: "{CUBE}.ws_ship_addr_sk = {customer_address__ship}.ca_address_sk"

      # web_sales -> ship_mode
      - name: ship_mode
        relationship: many_to_one
        sql: "{CUBE}.ws_ship_mode_sk = {ship_mode}.sm_ship_mode_sk"

      # web_sales -> warehouse
      - name: warehouse
        relationship: many_to_one
        sql: "{CUBE}.ws_warehouse_sk = {warehouse}.w_warehouse_sk"

      # web_sales -> promotion -> item, date_dim
      - name: promotion
        relationship: many_to_one
        sql: "{CUBE}.ws_promo_sk = {promotion}.p_promo_sk"

      # web_sales -> item
      - name: item
        relationship: many_to_one
        sql: "{CUBE}.ws_item_sk = {item}.i_item_sk"

      # web_sales -> web_site -> date_dim
      - name: web_site
        relationship: many_to_one
        sql: "{CUBE}.ws_web_site_sk = {web_site}.web_site_sk"

      # web_sales -> web_page -> date_dim, customer
      - name: web_page
        relationship: many_to_one
        sql: "{CUBE}.ws_web_page_sk = {web_page}.wp_web_page_sk"
        
    dimensions:
      - name: ws_item_sk
        sql: ws_item_sk
        type: number
        primary_key: true

      - name: ws_order_number
        sql: ws_order_number
        type: number

      - name: ws_quantity
        sql: ws_quantity
        type: number

      - name: ws_wholesale_cost
        sql: ws_wholesale_cost
        type: number

      - name: ws_list_price
        sql: ws_list_price
        type: number

      - name: ws_sales_price
        sql: ws_sales_price
        type: number

      - name: ws_ext_discount_amt
        sql: ws_ext_discount_amt
        type: number

      - name: ws_ext_sales_price
        sql: ws_ext_sales_price
        type: number

      - name: ws_ext_wholesale_cost
        sql: ws_ext_wholesale_cost
        type: number

      - name: ws_ext_list_price
        sql: ws_ext_list_price
        type: number

      - name: ws_ext_tax
        sql: ws_ext_tax
        type: number

      - name: ws_coupon_amt
        sql: ws_coupon_amt
        type: number

      - name: ws_ext_ship_cost
        sql: ws_ext_ship_cost
        type: number

      - name: ws_net_paid
        sql: ws_net_paid
        type: number

      - name: ws_net_paid_inc_tax
        sql: ws_net_paid_inc_tax
        type: number

      - name: ws_net_paid_inc_ship
        sql: ws_net_paid_inc_ship
        type: number

      - name: ws_net_paid_inc_ship_tax
        sql: ws_net_paid_inc_ship_tax
        type: number

      - name: ws_net_profit
        sql: ws_net_profit
        type: number

    measures:
      - name: count
        type: count

      - name: ext_list_price
        sql: ws_ext_list_price
        type: sum

      - name: ext_sales_price
        sql: ws_ext_sales_price
        type: sum

      - name: ext_ship_cost
        sql: ws_ext_ship_cost
        type: sum

      - name: ext_wholesale_cost
        sql: ws_ext_wholesale_cost
        type: sum

      - name: list_price
        sql: ws_list_price
        type: sum

      - name: order_number
        sql: ws_order_number
        type: sum

      - name: quantity
        sql: ws_quantity
        type: sum

      - name: sales_price
        sql: ws_sales_price
        type: sum

      - name: wholesale_cost
        sql: ws_wholesale_cost
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
