cubes:
  - name: household_demographics
    sql_table: main.household_demographics
    data_source: default

    joins: []

    dimensions:
      - name: hd_demo_sk
        sql: hd_demo_sk
        type: number
        primary_key: true

      - name: hd_income_band_sk
        sql: hd_income_band_sk
        type: number

      - name: hd_buy_potential
        sql: hd_buy_potential
        type: string

      - name: hd_dep_count
        sql: hd_dep_count
        type: number

      - name: hd_vehicle_count
        sql: hd_vehicle_count
        type: number

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
