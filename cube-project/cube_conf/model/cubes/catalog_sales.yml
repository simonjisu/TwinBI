cubes:
  - name: catalog_sales
    sql_table: main.catalog_sales
    data_source: default

    joins:
      - name: date_dim_sold
        relationship: many_to_one
        sql: "{CUBE}.cs_sold_date_sk = {date_dim_sold}.d_date_sk"

      - name: time_dim_sold
        relationship: many_to_one
        sql: "{CUBE}.cs_sold_time_sk = {time_dim_sold}.t_time_sk"

      - name: date_dim_shipped
        relationship: many_to_one
        sql: "{CUBE}.cs_ship_date_sk = {date_dim_shipped}.d_date_sk"

      - name: customer_billing
        relationship: many_to_one
        sql: "{CUBE}.cs_bill_customer_sk = {customer_billing}.c_customer_sk"

      - name: customer_address_current
        relationship: many_to_one
        sql: "{customer}.c_current_addr_sk = {customer_address}.ca_address_sk"

      - name: customer_demographics_billing
        relationship: many_to_one
        sql: "{CUBE}.cs_bill_cdemo_sk = {customer_demographics_billing}.cd_demo_sk"

      - name: household_demographics_billing
        relationship: many_to_one
        sql: "{CUBE}.cs_bill_hdemo_sk = {household_demographics_billing}.hd_demo_sk"

      - name: customer_address_billing
        relationship: many_to_one
        sql: "{CUBE}.cs_bill_addr_sk = {customer_address_billing}.ca_address_sk"
        
      - name: customer_shipping
        relationship: many_to_one
        sql: "{CUBE}.cs_ship_customer_sk = {customer_shipping}.c_customer_sk"

      - name: customer_demographics_shipping
        relationship: many_to_one
        sql: "{CUBE}.cs_ship_cdemo_sk = {customer_demographics_shipping}.cd_demo_sk"

      - name: household_demographics_shipping
        relationship: many_to_one
        sql: "{CUBE}.cs_ship_hdemo_sk = {household_demographics_shipping}.hd_demo_sk"

      - name: customer_address_shipping
        relationship: many_to_one
        sql: "{CUBE}.cs_ship_addr_sk = {customer_address_shipping}.ca_address_sk"

      - name: call_center
        relationship: many_to_one
        sql: "{CUBE}.cs_call_center_sk = {call_center}.cc_call_center_sk"

      - name: catalog_page
        relationship: many_to_one
        sql: "{CUBE}.cs_catalog_page_sk = {catalog_page}.cp_catalog_page_sk"

      - name: ship_mode
        relationship: many_to_one
        sql: "{CUBE}.cs_ship_mode_sk = {ship_mode}.sm_ship_mode_sk"

      - name: warehouse
        relationship: many_to_one
        sql: "{CUBE}.cs_warehouse_sk = {warehouse}.w_warehouse_sk"

      - name: item
        relationship: many_to_one
        sql: "{CUBE}.cs_item_sk = {item}.i_item_sk"

      - name: promotion
        relationship: many_to_one
        sql: "{CUBE}.cs_promo_sk = {promotion}.p_promo_sk"

    dimensions:
      - name: cs_item_sk
        sql: cs_item_sk
        type: number
        primary_key: true

      - name: cs_order_number
        sql: cs_order_number
        type: number

      - name: cs_quantity
        sql: cs_quantity
        type: number

      - name: cs_wholesale_cost
        sql: cs_wholesale_cost
        type: number

      - name: cs_list_price
        sql: cs_list_price
        type: number

      - name: cs_sales_price
        sql: cs_sales_price
        type: number

      - name: cs_ext_discount_amt
        sql: cs_ext_discount_amt
        type: number

      - name: cs_ext_sales_price
        sql: cs_ext_sales_price
        type: number

      - name: cs_ext_wholesale_cost
        sql: cs_ext_wholesale_cost
        type: number

      - name: cs_ext_list_price
        sql: cs_ext_list_price
        type: number

      - name: cs_ext_tax
        sql: cs_ext_tax
        type: number

      - name: cs_coupon_amt
        sql: cs_coupon_amt
        type: number

      - name: cs_ext_ship_cost
        sql: cs_ext_ship_cost
        type: number

      - name: cs_net_paid
        sql: cs_net_paid
        type: number

      - name: cs_net_paid_inc_tax
        sql: cs_net_paid_inc_tax
        type: number

      - name: cs_net_paid_inc_ship
        sql: cs_net_paid_inc_ship
        type: number

      - name: cs_net_paid_inc_ship_tax
        sql: cs_net_paid_inc_ship_tax
        type: number

      - name: cs_net_profit
        sql: cs_net_profit
        type: number

    measures:
      - name: count
        type: count

      - name: ext_list_price
        sql: cs_ext_list_price
        type: sum

      - name: ext_sales_price
        sql: cs_ext_sales_price
        type: sum

      - name: ext_ship_cost
        sql: cs_ext_ship_cost
        type: sum

      - name: ext_wholesale_cost
        sql: cs_ext_wholesale_cost
        type: sum

      - name: list_price
        sql: cs_list_price
        type: sum

      - name: order_number
        sql: cs_order_number
        type: sum

      - name: quantity
        sql: cs_quantity
        type: sum

      - name: sales_price
        sql: cs_sales_price
        type: sum

      - name: wholesale_cost
        sql: cs_wholesale_cost
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
