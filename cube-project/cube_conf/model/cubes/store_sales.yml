cubes:
  - name: store_sales
    sql_table: main.store_sales
    data_source: default

    joins:
      # store_sales -> date_dim
      - name: date_dim
        relationship: many_to_one
        sql: "{CUBE}.ss_sold_date_sk = {date_dim}.d_date_sk"

      # store_sales -> time_dim
      - name: time_dim
        relationship: many_to_one
        sql: "{CUBE}.ss_sold_time_sk = {time_dim}.t_time_sk"

      # store_sales -> item
      - name: item
        relationship: many_to_one
        sql: "{CUBE}.ss_item_sk = {item}.i_item_sk"

      # store_sales -> customer -> customer_demographics, household_demographics, customer_address, date_dim
      - name: customer
        relationship: many_to_one
        sql: "{CUBE}.ss_customer_sk = {customer}.c_customer_sk"

      # store_sales -> customer_demographics
      - name: customer_demographics
        relationship: many_to_one
        sql: "{CUBE}.ss_cdemo_sk = {customer_demographics}.cd_demo_sk"

      # store_sales -> household_demographics
      - name: household_demographics
        relationship: many_to_one
        sql: "{CUBE}.ss_hdemo_sk = {household_demographics}.hd_demo_sk"

      # store_sales -> customer_address
      - name: customer_address
        relationship: many_to_one
        sql: "{CUBE}.ss_addr_sk = {customer_address}.ca_address_sk"

      # store_sales -> store -> date_dim
      - name: store
        relationship: many_to_one
        sql: "{CUBE}.ss_store_sk = {store}.s_store_sk"

      # store_sales -> promotion -> date_dim
      - name: promotion
        relationship: many_to_one
        sql: "{CUBE}.ss_promo_sk = {promotion}.p_promo_sk"

    dimensions:
      - name: ss_item_sk
        sql: ss_item_sk
        type: number
        primary_key: true

      - name: ss_ticket_number
        sql: ss_ticket_number
        type: number

      - name: ss_quantity
        sql: ss_quantity
        type: number

      - name: ss_wholesale_cost
        sql: ss_wholesale_cost
        type: number

      - name: ss_list_price
        sql: ss_list_price
        type: number

      - name: ss_sales_price
        sql: ss_sales_price
        type: number

      - name: ss_ext_discount_amt
        sql: ss_ext_discount_amt
        type: number

      - name: ss_ext_sales_price
        sql: ss_ext_sales_price
        type: number

      - name: ss_ext_wholesale_cost
        sql: ss_ext_wholesale_cost
        type: number

      - name: ss_ext_list_price
        sql: ss_ext_list_price
        type: number

      - name: ss_ext_tax
        sql: ss_ext_tax
        type: number

      - name: ss_coupon_amt
        sql: ss_coupon_amt
        type: number

      - name: ss_net_paid
        sql: ss_net_paid
        type: number

      - name: ss_net_paid_inc_tax
        sql: ss_net_paid_inc_tax
        type: number

      - name: ss_net_profit
        sql: ss_net_profit
        type: number

    measures:
      - name: count
        type: count

      - name: ext_list_price
        sql: ss_ext_list_price
        type: sum

      - name: ext_sales_price
        sql: ss_ext_sales_price
        type: sum

      - name: ext_wholesale_cost
        sql: ss_ext_wholesale_cost
        type: sum

      - name: list_price
        sql: ss_list_price
        type: sum

      - name: quantity
        sql: ss_quantity
        type: sum

      - name: sales_price
        sql: ss_sales_price
        type: sum

      - name: ticket_number
        sql: ss_ticket_number
        type: sum

      - name: wholesale_cost
        sql: ss_wholesale_cost
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
