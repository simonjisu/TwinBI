cubes:
  - name: catalog_returns
    sql_table: main.catalog_returns
    data_source: default

    joins:
      - name: date_dim
        relationship: many_to_one
        sql: "{CUBE}.cr_returned_date_sk = {date_dim}.d_date_sk"

      - name: time_dim
        relationship: many_to_one
        sql: "{CUBE}.cr_returned_time_sk = {time_dim}.t_time_sk"

      - name: item
        relationship: many_to_one
        sql: "{CUBE}.cr_item_sk = {item}.i_item_sk"

      - name: customer_refunded
        relationship: many_to_one
        sql: "{CUBE}.cr_refunded_customer_sk = {customer_refunded}.c_customer_sk"

      - name: customer_demographics_refunded
        relationship: many_to_one
        sql: "{CUBE}.cr_refunded_cdemo_sk = {customer_demographics_refunded}.cd_demo_sk"

      - name: household_demographics_refunded
        relationship: many_to_one
        sql: "{CUBE}.cr_refunded_hdemo_sk = {household_demographics_refunded}.hd_demo_sk"

      - name: customer_address_refunded
        relationship: many_to_one
        sql: "{CUBE}.cr_refunded_addr_sk = {customer_address_refunded}.ca_address_sk"

      - name: customer_returning
        relationship: many_to_one
        sql: "{CUBE}.cr_returning_customer_sk = {customer_returning}.c_customer_sk"

      - name: customer_demographics_returning
        relationship: many_to_one
        sql: "{CUBE}.cr_returning_cdemo_sk = {customer_demographics_returning}.cd_demo_sk"

      - name: household_demographics_returning
        relationship: many_to_one
        sql: "{CUBE}.cr_returning_hdemo_sk = {household_demographics_returning}.hd_demo_sk"

      - name: customer_address_returning
        relationship: many_to_one
        sql: "{CUBE}.cr_returning_addr_sk = {customer_address_returning}.ca_address_sk"

      - name: call_center
        relationship: many_to_one
        sql: "{CUBE}.cr_call_center_sk = {call_center}.cc_call_center_sk"

      - name: catalog_page
        relationship: many_to_one
        sql: "{CUBE}.cr_catalog_page_sk = {catalog_page}.cp_catalog_page_sk"

      - name: ship_mode
        relationship: many_to_one
        sql: "{CUBE}.cr_ship_mode_sk = {ship_mode}.sm_ship_mode_sk"

      - name: warehouse
        relationship: many_to_one
        sql: "{CUBE}.cr_warehouse_sk = {warehouse}.w_warehouse_sk"

      - name: reason
        relationship: many_to_one
        sql: "{CUBE}.cr_reason_sk = {reason}.r_reason_sk"

      - name: catalog_sales
        relationship: many_to_one
        sql: "{CUBE}.cr_order_number = {catalog_sales}.cs_order_number AND {CUBE}.cr_item_sk = {catalog_sales}.cs_item_sk"

    dimensions:
      - name: cr_item_sk
        sql: cr_item_sk
        type: number
        primary_key: true

      - name: cr_order_number
        sql: cr_order_number
        type: number

      - name: cr_return_quantity
        sql: cr_return_quantity
        type: number

      - name: cr_return_amount
        sql: cr_return_amount
        type: number

      - name: cr_return_tax
        sql: cr_return_tax
        type: number

      - name: cr_return_amt_inc_tax
        sql: cr_return_amt_inc_tax
        type: number

      - name: cr_fee
        sql: cr_fee
        type: number

      - name: cr_return_ship_cost
        sql: cr_return_ship_cost
        type: number

      - name: cr_refunded_cash
        sql: cr_refunded_cash
        type: number

      - name: cr_reversed_charge
        sql: cr_reversed_charge
        type: number

      - name: cr_store_credit
        sql: cr_store_credit
        type: number

      - name: cr_net_loss
        sql: cr_net_loss
        type: number

    measures:
      - name: count
        type: count

      - name: order_number
        sql: cr_order_number
        type: sum

      - name: return_amount
        sql: cr_return_amount
        type: sum

      - name: return_quantity
        sql: cr_return_quantity
        type: sum

      - name: return_ship_cost
        sql: cr_return_ship_cost
        type: sum

      - name: return_tax
        sql: cr_return_tax
        type: sum

      - name: fee
        sql: cr_fee
        type: sum

      - name: refunded_cash
        sql: cr_refunded_cash
        type: sum

      - name: reversed_charge
        sql: cr_reversed_charge
        type: sum

      - name: store_credit
        sql: cr_store_credit
        type: sum

      - name: net_loss
        sql: cr_net_loss
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
