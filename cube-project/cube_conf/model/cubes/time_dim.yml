cubes:
  - name: time_dim
    sql_table: main.time_dim
    data_source: default

    joins: []

    dimensions:
      - name: t_time_sk
        sql: t_time_sk
        type: number
        primary_key: true

      - name: t_am_pm
        sql: t_am_pm
        type: string

      - name: t_time
        sql: t_time
        type: number

      - name: t_hour
        sql: t_hour
        type: number

      - name: t_minute
        sql: t_minute
        type: number

      - name: t_second
        sql: t_second
        type: number

      - name: t_meal_time
        sql: t_meal_time
        type: string

      - name: t_shift
        sql: t_shift
        type: string

      - name: t_sub_shift
        sql: t_sub_shift
        type: string

      - name: t_time_id
        sql: t_time_id
        type: string

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
