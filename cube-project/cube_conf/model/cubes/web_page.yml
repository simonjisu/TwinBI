cubes:
  - name: web_page
    sql_table: main.web_page
    data_source: default

    joins: []

    dimensions:
      - name: wp_web_page_sk
        sql: wp_web_page_sk
        type: number
        primary_key: true

      - name: wp_autogen_flag
        sql: wp_autogen_flag
        type: string

      - name: wp_creation_date_sk
        sql: wp_creation_date_sk
        type: number

      - name: wp_access_date_sk
        sql: wp_access_date_sk
        type: number

      - name: wp_customer_sk
        sql: wp_customer_sk
        type: number

      - name: wp_type
        sql: wp_type
        type: string

      - name: wp_url
        sql: wp_url
        type: string

      - name: wp_web_page_id
        sql: wp_web_page_id
        type: string

      - name: wp_rec_end_date
        sql: wp_rec_end_date
        type: time

      - name: wp_rec_start_date
        sql: wp_rec_start_date
        type: time

      - name: wp_char_count
        sql: wp_char_count
        type: number

      - name: wp_image_count
        sql: wp_image_count
        type: number

      - name: wp_link_count
        sql: wp_link_count
        type: number

      - name: wp_max_ad_count
        sql: wp_max_ad_count
        type: number

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
