cubes:
  - name: store_returns
    sql_table: main.store_returns
    data_source: default

    joins:
      - name: date_dim
        relationship: many_to_one
        sql: "{CUBE}.sr_returned_date_sk = {date_dim}.d_date_sk"

      - name: time_dim
        relationship: many_to_one
        sql: "{CUBE}.sr_return_time_sk = {time_dim}.t_time_sk"

      - name: item
        relationship: many_to_one
        sql: "{CUBE}.sr_item_sk = {item}.i_item_sk"

      - name: customer
        relationship: many_to_one
        sql: "{CUBE}.sr_customer_sk = {customer}.c_customer_sk"

      - name: customer_address_current
        relationship: many_to_one
        sql: "{customer}.c_current_addr_sk = {customer_address_current}.ca_address_sk"

      - name: customer_demographics
        relationship: many_to_one
        sql: "{CUBE}.sr_cdemo_sk = {customer_demographics}.cd_demo_sk"

      - name: household_demographics
        relationship: many_to_one
        sql: "{CUBE}.sr_hdemo_sk = {household_demographics}.hd_demo_sk"

      - name: customer_address
        relationship: many_to_one
        sql: "{CUBE}.sr_addr_sk = {customer_address}.ca_address_sk"

      - name: store
        relationship: many_to_one
        sql: "{CUBE}.sr_store_sk = {store}.s_store_sk"

      - name: reason
        relationship: many_to_one
        sql: "{CUBE}.sr_reason_sk = {reason}.r_reason_sk"

      - name: store_sales
        relationship: many_to_one
        sql: "{CUBE}.sr_ticket_number = {store_sales}.ss_ticket_number AND {CUBE}.sr_item_sk = {store_sales}.ss_item_sk"

    dimensions:
      - name: sr_item_sk
        sql: sr_item_sk
        type: number
        primary_key: true

      - name: sr_ticket_number
        sql: sr_ticket_number
        type: number

      - name: sr_return_quantity
        sql: sr_return_quantity
        type: number

      - name: sr_return_amt
        sql: sr_return_amt
        type: number

      - name: sr_return_tax
        sql: sr_return_tax
        type: number

      - name: sr_return_amt_inc_tax
        sql: sr_return_amt_inc_tax
        type: number

      - name: sr_fee
        sql: sr_fee
        type: number

      - name: sr_return_ship_cost
        sql: sr_return_ship_cost
        type: number

      - name: sr_refunded_cash
        sql: sr_refunded_cash
        type: number

      - name: sr_reversed_charge
        sql: sr_reversed_charge
        type: number

      - name: sr_store_credit
        sql: sr_store_credit
        type: number

      - name: sr_net_loss
        sql: sr_net_loss
        type: number

    measures:
      - name: count
        type: count

      - name: return_amount
        sql: sr_return_amt
        type: sum

      - name: return_quantity
        sql: sr_return_quantity
        type: sum

      - name: return_ship_cost
        sql: sr_return_ship_cost
        type: sum

      - name: return_tax
        sql: sr_return_tax
        type: sum

      - name: fee
        sql: sr_fee
        type: sum

      - name: refunded_cash
        sql: sr_refunded_cash
        type: sum

      - name: reversed_charge
        sql: sr_reversed_charge
        type: sum

      - name: store_credit
        sql: sr_store_credit
        type: sum

      - name: ticket_number
        sql: sr_ticket_number
        type: sum

      - name: net_loss
        sql: sr_net_loss
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
