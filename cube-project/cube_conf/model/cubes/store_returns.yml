cubes:
  - name: store_returns
    sql_table: main.store_returns
    data_source: default

    joins:
      # store_returns -> date_dim
      - name: date_dim
        relationship: many_to_one
        sql: "{CUBE}.sr_returned_date_sk = {date_dim}.d_date_sk"

      # store_returns -> time_dim
      - name: time_dim
        relationship: many_to_one
        sql: "{CUBE}.sr_return_time_sk = {time_dim}.t_time_sk"

      # store_returns -> item
      - name: item
        relationship: many_to_one
        sql: "{CUBE}.sr_item_sk = {item}.i_item_sk"

      # store_returns -> customer -> customer_demographics, household_demographics, customer_address, date_dim
      - name: customer
        relationship: many_to_one
        sql: "{CUBE}.sr_customer_sk = {customer}.c_customer_sk"

      # store_returns -> customer_demographics
      - name: customer_demographics
        relationship: many_to_one
        sql: "{CUBE}.sr_cdemo_sk = {customer_demographics}.cd_demo_sk"

      # store_returns -> household_demographics
      - name: household_demographics
        relationship: many_to_one
        sql: "{CUBE}.sr_hdemo_sk = {household_demographics}.hd_demo_sk"

      # store_returns -> customer_address
      - name: customer_address
        relationship: many_to_one
        sql: "{CUBE}.sr_addr_sk = {customer_address}.ca_address_sk"

      # store_returns -> store -> date_dim
      - name: store
        relationship: many_to_one
        sql: "{CUBE}.sr_store_sk = {store}.s_store_sk"

      # store_returns -> reason
      - name: reason
        relationship: many_to_one
        sql: "{CUBE}.sr_reason_sk = {reason}.r_reason_sk"

      # store_returns -> store_sales
      - name: store_sales
        relationship: many_to_one
        sql: "{CUBE}.sr_ticket_number = {store_sales}.ss_ticket_number"

    dimensions:
      - name: sr_item_sk
        sql: sr_item_sk
        type: number
        primaryKey: true
      
      - name: sr_returned_date_sk
        sql: sr_returned_date_sk
        type: number

      - name: sr_return_time_sk
        sql: sr_return_time_sk
        type: number

      - name: sr_customer_sk
        sql: sr_customer_sk
        type: number

      - name: sr_cdemo_sk
        sql: sr_cdemo_sk
        type: number

      - name: sr_hdemo_sk
        sql: sr_hdemo_sk
        type: number

      - name: sr_addr_sk
        sql: sr_addr_sk
        type: number

      - name: sr_store_sk
        sql: sr_store_sk
        type: number

      - name: sr_reason_sk
        sql: sr_reason_sk
        type: number

      - name: sr_ticket_number
        sql: sr_ticket_number
        type: number

      - name: sr_return_quantity
        sql: sr_return_quantity
        type: number

      - name: sr_return_amt
        sql: sr_return_amt
        type: number

      - name: sr_return_tax
        sql: sr_return_tax
        type: number

      - name: sr_return_amt_inc_tax
        sql: sr_return_amt_inc_tax
        type: number

      - name: sr_fee
        sql: sr_fee
        type: number

      - name: sr_return_ship_cost
        sql: sr_return_ship_cost
        type: number

      - name: sr_refunded_cash
        sql: sr_refunded_cash
        type: number

      - name: sr_reversed_charge
        sql: sr_reversed_charge
        type: number

      - name: sr_store_credit
        sql: sr_store_credit
        type: number

      - name: sr_net_loss
        sql: sr_net_loss
        type: number

    measures:
      - name: count
        type: count

      - name: total_return_amount
        sql: sr_return_amt
        type: sum

      # Q1
      - name: total_return_by_customer_store
        multi_stage: true
        sql: "{total_return_amount}"
        type: sum
        group_by:
          - store_returns.sr_customer_sk
          - store_returns.sr_store_sk
      # Q1
      - name: store_avg_return
        multi_stage: true
        sql: "{total_return_by_customer_store}"
        type: avg
        group_by:
          - store_returns.sr_store_sk
      # Q1
      - name: return_vs_store_avg
        multi_stage: true
        sql: "{total_return_by_customer_store} / NULLIF({store_avg_return}, 0)"
        type: number
        
      - name: total_return_quantity
        sql: sr_return_quantity
        type: sum

      - name: total_return_ship_cost
        sql: sr_return_ship_cost
        type: sum

      - name: total_return_tax
        sql: sr_return_tax
        type: sum

      - name: total_fee
        sql: sr_fee
        type: sum

      - name: total_refunded_cash
        sql: sr_refunded_cash
        type: sum

      - name: total_reversed_charge
        sql: sr_reversed_charge
        type: sum

      - name: total_store_credit
        sql: sr_store_credit
        type: sum

      - name: total_ticket_number
        sql: sr_ticket_number
        type: sum

      - name: total_net_loss
        sql: sr_net_loss
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
