cubes:
  - name: customer_demographics
    sql_table: main.customer_demographics
    data_source: default

    joins: []

    dimensions:
      - name: cd_demo_sk
        sql: cd_demo_sk
        type: number
        primary_key: true

      - name: cd_credit_rating
        sql: cd_credit_rating
        type: string

      - name: cd_education_status
        sql: cd_education_status
        type: string

      - name: cd_gender
        sql: cd_gender
        type: string

      - name: cd_marital_status
        sql: cd_marital_status
        type: string

      - name: cd_purchase_estimate
        sql: cd_purchase_estimate
        type: number

      - name: cd_dep_count
        sql: cd_dep_count
        type: number

      - name: cd_dep_employed_count
        sql: cd_dep_employed_count
        type: number

      - name: cd_dep_college_count
        sql: cd_dep_college_count
        type: number

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
