cubes:
  - name: promotion
    sql_table: main.promotion
    data_source: default

    joins:
      - name: date_dim__start_date
        relationship: many_to_one
        sql: "{CUBE}.p_start_date_sk = {date_dim__start_date}.d_date_sk"

      - name: date_dim__end_date
        relationship: many_to_one
        sql: "{CUBE}.p_end_date_sk = {date_dim__end_date}.d_date_sk"

      - name: item
        relationship: many_to_one
        sql: "{CUBE}.p_item_sk = {item}.i_item_sk"

    dimensions:
      - name: p_promo_sk
        sql: p_promo_sk
        type: number
        primary_key: true

      - name: p_channel_catalog
        sql: p_channel_catalog
        type: string

      - name: p_channel_demo
        sql: p_channel_demo
        type: string

      - name: p_channel_details
        sql: p_channel_details
        type: string

      - name: p_channel_dmail
        sql: p_channel_dmail
        type: string

      - name: p_channel_email
        sql: p_channel_email
        type: string

      - name: p_channel_event
        sql: p_channel_event
        type: string

      - name: p_channel_press
        sql: p_channel_press
        type: string

      - name: p_channel_radio
        sql: p_channel_radio
        type: string

      - name: p_channel_tv
        sql: p_channel_tv
        type: string

      - name: p_discount_active
        sql: p_discount_active
        type: string

      - name: p_end_date_sk
        sql: p_end_date_sk
        type: number

      - name: p_promo_id
        sql: p_promo_id
        type: string

      - name: p_promo_name
        sql: p_promo_name
        type: string

      - name: p_start_date_sk
        sql: p_start_date_sk
        type: number

      - name: p_item_sk
        sql: p_item_sk
        type: number

      - name: p_purpose
        sql: p_purpose
        type: string

      - name: p_cost
        sql: p_cost
        type: number

      - name: p_response_target
        sql: p_response_target
        type: number

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
