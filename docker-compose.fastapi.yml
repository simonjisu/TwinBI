services:
  api:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    container_name: fastapi_api
    ports:
      - "8000:8000"
    env_file:
      - ./fastapi/.env
    environment:
      - DUCKDB_PATH=/logs/events.duckdb
      - SUPERSET_META_DB_URI=postgresql://superset:superset@superset_db:5432/superset
      - SUPERSET_POLL_INTERVAL_SEC=2
      - SUPERSET_BATCH_SIZE=200
      # Capture chart queries and semantic dashboard interactions. Generic
      # Superset "log" rows are normalized to their event_name by the poller.
      - SUPERSET_INGEST_ALLOW_ACTIONS=ChartDataRestApi.data,log
      - SUPERSET_PUBLIC_URL=http://localhost:8088
      - SUPERSET_INTERNAL_URL=http://superset_app:8088
      # The bundled Superset initialization creates this local admin account.
      # Allow deployment environments to override it without editing compose.
      - SUPERSET_USERNAME=${SUPERSET_USERNAME:-admin}
      - SUPERSET_PASSWORD=${SUPERSET_PASSWORD:-admin}
      - SUPERSET_GUEST_AUD=superset
      # Keep empty to ingest logs across dashboards (12/13/...)
      - SUPERSET_LOG_DASHBOARD_ID=
      - SUPERSET_LOG_USER_ID=
      - CUBE_REST_URL=http://sales:4000
      - CUBE_SQL_HOST=sales
      - CUBE_SQL_PORT=15432
      - CUBE_CONF_PATH=/cube/conf
      - CORS_ORIGINS=http://localhost:8501
    volumes:
      - ./data/logs:/logs
      - ./data/sales:/app/cube_data:ro
      - ./src:/app/src:ro
      - ./data/sales/cube_conf:/cube/conf
    networks:
      - agent4olap_net

networks:
  agent4olap_net:
    external: true
