<div id="{{CHAT_CONTAINER_ID}}" class="chat-root">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --chat-bg: #262730;
      --chat-bg-soft: #1c2230;
      --chat-panel: #232a3a;
      --chat-panel-2: #2a3143;
      --chat-border: rgba(180, 196, 224, 0.2);
      --chat-text: #edf2ff;
      --chat-muted: #aeb8ce;
      --chat-accent: #2aa5d6;
      --chat-accent-soft: rgba(42, 165, 214, 0.22);
    }
    html, body {
      background: var(--chat-bg);
    }
    .chat-root {
      font-family: "IBM Plex Sans KR", "SUIT", "Pretendard", sans-serif;
      color: var(--chat-text);
      background: var(--chat-bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .focus-col {
      width: min(96%, 76ch);
      margin: 0 auto;
    }
    .chat-header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: linear-gradient(180deg, rgba(19, 23, 34, 0.96) 0%, rgba(19, 23, 34, 0.9) 100%);
      backdrop-filter: blur(8px);
      padding: 6px 0 10px 0;
      border-bottom: 1px solid var(--chat-border);
      flex: 0 0 auto;
    }
    .chat-title {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 22px;
      letter-spacing: 0.01em;
      color: #f7faff;
    }
    .chat-input-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    .chat-input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--chat-border);
      background: #f7f9ff;
      color: #111827;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.5;
      resize: vertical;
      min-height: 44px;
      max-height: 240px;
      overflow: auto;
    }
    .chat-input:focus {
      outline: none;
      border-color: rgba(42, 165, 214, 0.75);
      box-shadow: 0 0 0 2px rgba(42, 165, 214, 0.2);
    }
    .chat-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .chat-send {
      border: 1px solid rgba(42, 165, 214, 0.5);
      background: linear-gradient(180deg, #1f7aa0 0%, #175f7d 100%);
      color: #f8fdff;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
    }
    .chat-clear {
      border: 1px solid var(--chat-border);
      background: #1a2030;
      color: #d5def4;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .chat-stop {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #7f1d1d;
      color: #fef2f2;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .chat-stop[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .chat-status {
      margin-top: 6px;
      font-size: 13px;
      color: var(--chat-muted);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .chat-panel {
      border: 1px solid var(--chat-border);
      border-radius: 16px;
      padding: 8px;
      background: linear-gradient(180deg, rgba(30, 37, 53, 0.88) 0%, rgba(24, 30, 43, 0.9) 100%);
      margin-top: 10px;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .focus-col--panel {
      width: min(98%, 76ch);
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .scroller {
      overflow: auto;
      display: flex;
      flex-direction: column-reverse;
      overflow-anchor: auto !important;
      flex: 1 1 auto;
      min-height: 0;
      scrollbar-gutter: stable;
    }
    .scroller-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px 0 14px 0;
    }
    .meta {
      display: flex;
      align-items: center;
      margin: 0 2px -6px 2px;
      opacity: 0.9;
    }
    .meta.user {
      justify-content: flex-end;
    }
    .meta.assistant {
      justify-content: flex-start;
    }
    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transform: translateZ(0);
    }
    .bubble {
      padding: 14px 16px;
      border-radius: 15px;
      max-width: min(92%, 72ch);
      line-height: 1.62;
      font-size: 0.99rem;
      white-space: normal;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .bubble p {
      margin: 0 0 0.28rem 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .bubble p:last-child {
      margin-bottom: 0;
    }
    .bubble ul, .bubble ol {
      margin: 0.45rem 0 0.55rem 1.15rem;
      padding: 0;
      display: grid;
      gap: 0.42rem;
    }
    .bubble li, .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .bubble h1, .bubble h2, .bubble h3 {
      margin: 0.85rem 0 0.4rem;
      line-height: 1.35;
      color: #f7fbff;
      letter-spacing: 0.01em;
    }
    .bubble h1 { font-size: 1.17rem; }
    .bubble h2 { font-size: 1.08rem; }
    .bubble h3 { font-size: 1.02rem; }
    .bubble pre {
      margin: 0.65rem 0;
      padding: 10px 11px;
      border-radius: 10px;
      background: rgba(7, 10, 17, 0.65);
      border: 1px solid rgba(154, 171, 205, 0.25);
      overflow: auto;
      max-height: 320px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble blockquote {
      margin: 0.5rem 0;
      padding: 0.25rem 0.85rem;
      border-left: 3px solid rgba(42, 165, 214, 0.65);
      color: #d9e2f7;
      background: rgba(42, 165, 214, 0.08);
      border-radius: 0 8px 8px 0;
    }
    .bubble code {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      background: rgba(228, 239, 255, 0.16);
      padding: 0.09rem 0.32rem;
      border-radius: 6px;
      font-size: 0.9em;
    }
    .bubble.user {
      margin-left: auto;
      background: var(--chat-accent-soft);
      border: 1px solid rgba(42, 165, 214, 0.45);
    }
    .bubble.assistant {
      margin-right: auto;
      background: linear-gradient(180deg, var(--chat-panel) 0%, var(--chat-panel-2) 100%);
      border: 1px solid rgba(182, 197, 224, 0.26);
    }
    .trace-details {
      margin-top: 2px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      padding: 2px 6px 3px;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
    .trace-details summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5f5;
      font-size: 13px;
      user-select: none;
      padding: 0;
      line-height: 1.15;
    }
    .trace-details summary::-webkit-details-marker { display: none; }

    .trace-details .spinner {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #93c5fd; /* 파란색 */
      animation: spin 0.8s linear infinite;
    }

    .trace-details[open] summary {
      margin-bottom: 1px;
    }
    

    .trace-list {
      margin: 0;
      padding-left: 16px;
      display: block;
    }
    .trace-item {
      font-size: 12px;
      color: rgba(255,255,255,0.85);
      line-height: 1.2;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }
    .trace-item p {
      margin: 0;
    }
    .trace-item ul, .trace-item ol {
      margin: 0.25rem 0 0.25rem 1rem;
      padding: 0;
    }
    .trace-json {
      margin-top: 4px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      padding: 4px 6px;
      background: rgba(255,255,255,0.04);
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
    .trace-json summary {
      cursor: pointer;
      color: #cbd5f5;
      font-size: 11px;
      user-select: none;
      list-style: none;
    }
    .trace-json summary::-webkit-details-marker { display: none; }
    .trace-json-pre {
      margin: 6px 0 0 0;
      padding: 8px;
      border-radius: 6px;
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.9);
      font-size: 11px;
      overflow: auto;
      max-height: 240px;
      white-space: pre;
    }
    .trace-json-tree {
      margin: 6px 0 0 0;
      font-size: 11px;
      line-height: 1.35;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .trace-json-node {
      margin: 2px 0;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .trace-json-node details {
      margin-left: 8px;
      min-width: 0;
      max-width: 100%;
    }
    .trace-json-node summary {
      cursor: pointer;
      color: #d1d5db;
      display: block;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .json-key {
      color: #93c5fd;
      font-weight: 600;
      margin-right: 4px;
    }
    .json-type {
      color: #9ca3af;
      margin-left: 4px;
    }
    .json-string {
      color: #86efac;
    }
    .json-number {
      color: #fcd34d;
    }
    .json-boolean {
      color: #c4b5fd;
    }
    .json-null {
      color: #fca5a5;
    }
    .trace-ts {
      color: rgba(255,255,255,0.45);
      margin-right: 6px;
    }
  </style>
  <div class="chat-header">
    <div class="focus-col">
      <div class="chat-title">Chat</div>
      <div class="chat-input-row">
        <textarea class="chat-input" rows="1" placeholder="Ask about what you see..."></textarea>
        <div class="chat-actions">
          <button class="chat-send">Send</button>
          <button class="chat-stop" disabled>Stop</button>
          <button class="chat-clear">Clear Chat</button>
        </div>
      </div>
      <div class="chat-status">ready</div>
    </div>
  </div>
  <div class="chat-panel">
    <div class="focus-col focus-col--panel">
      <div class="scroller">
        <div class="scroller-content"></div>
      </div>
    </div>
  </div>
</div>
<script>
  const root = document.getElementById("{{CHAT_CONTAINER_ID}}");
  const inputEl = root.querySelector(".chat-input");
  const sendBtn = root.querySelector(".chat-send");
  const stopBtn = root.querySelector(".chat-stop");
  const clearBtn = root.querySelector(".chat-clear");
  const statusEl = root.querySelector(".chat-status");
  const listEl = root.querySelector(".scroller-content");

  const apiBase = "{{FASTAPI_PUBLIC_URL}}";
  const sessionId = "{{SESSION_ID}}";
  const userId = "{{USER_ID}}";
  const dashboardId = "{{DASHBOARD_ID}}";
  const supersetUsername = "{{SUPERSET_USERNAME}}";
  const supersetPassword = "{{SUPERSET_PASSWORD}}";
  const agentModel = "{{AGENT_MODEL}}";
  const chatScopeKey = dashboardId
    ? `chat_scope_${dashboardId}_${userId || "anon"}`
    : `chat_scope_default_${userId || "anon"}`;
  const storageKey = `${chatScopeKey}_messages`;
  const chatThreadStorageKey = `${chatScopeKey}_thread`;
  const chatSessionBaseKey = `${chatScopeKey}_base`;
  let chatSessionBaseId = localStorage.getItem(chatSessionBaseKey);
  if (!chatSessionBaseId) {
    chatSessionBaseId = `${dashboardId || "default"}:${userId || "anon"}`;
    localStorage.setItem(chatSessionBaseKey, chatSessionBaseId);
  }
  let chatThreadId = localStorage.getItem(chatThreadStorageKey) || "0";
  if (!localStorage.getItem(chatThreadStorageKey)) {
    localStorage.setItem(chatThreadStorageKey, chatThreadId);
  }
  let currentController = null;
  let isStreaming = false;
  let pendingAutoRefresh = false;

  function getChatSessionId() {
    return `${chatSessionBaseId}::chat::${chatThreadId}`;
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function authHeaders(extra = {}) {
    const headers = { ...extra };
    if (supersetUsername) headers["X-Superset-Username"] = supersetUsername;
    if (supersetPassword) headers["X-Superset-Password"] = supersetPassword;
    return headers;
  }

  function setStreamingState(nextState) {
    isStreaming = nextState;
    sendBtn.disabled = nextState;
    stopBtn.disabled = !nextState;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function markdownToHtml(value) {
    const text = toText(value || "");
    if (window.marked && typeof window.marked.parse === "function") {
      return window.marked.parse(text, { gfm: true, breaks: true });
    }
    return escapeHtml(text).replaceAll("\n", "<br>");
  }

  function loadMessages() {
    try {
      const raw = localStorage.getItem(storageKey);
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveMessages(messages) {
    localStorage.setItem(storageKey, JSON.stringify(messages));
  }

  function renderMessages(messages) {
    listEl.innerHTML = "";
    const recent = messages.slice(-80);

    for (const msg of recent) {
      const role = msg.role === "user" ? "user" : "assistant";
      const icon = role === "user" ? "🧑" : "🤖";

      const meta = document.createElement("div");
      meta.className = `meta ${role}`;
      meta.innerHTML = `<span class="avatar">${icon}</span>`;

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;

      if (role === "assistant") {
        const markdownText = markdownToHtml(msg.content || "");
        const events = Array.isArray(msg.events) ? msg.events : [];
        const isLoading = !!msg.is_loading;

        let traceHtml = "";
        if (events.length) {
          const summaryLabel = isLoading
            ? `Reasoning Trace (${events.length})`
            : `Reasoning Trace (${events.length})`;

          const items = events
            .map((e) => {
              const ts = e.ts ? `<span class="trace-ts">${escapeHtml(e.ts)}</span>` : "";
              const jsonDetails = e.raw_json
                ? `<details class="trace-json"><summary>JSON details</summary><div class="trace-json-tree">${renderJsonTree(e.raw_json)}</div></details>`
                : "";
              return `<li class="trace-item">${ts}${markdownToHtml(e.text || "")}${jsonDetails}</li>`;
            })
            .join("");

          traceHtml = `
            <details class="trace-details" ${isLoading ? "open" : ""}>
              <summary>
                ${isLoading ? `<span class="spinner"></span>` : ""}
                <span>${escapeHtml(summaryLabel)}</span>
              </summary>
              <ol class="trace-list">${items}</ol>
            </details>
          `;
        } else if (isLoading) {
          traceHtml = `
            <details class="trace-details" open>
              <summary>
                <span class="spinner"></span>
                <span>Running...</span>
              </summary>
            </details>
          `;
        }

        bubble.innerHTML = `${markdownText || ""}${traceHtml}`;
      } else {
        bubble.innerHTML = markdownToHtml(msg.content || "");
      }

      listEl.appendChild(meta);
      listEl.appendChild(bubble);
    }
  }

  function toText(value) {
    if (value == null) return "";
    if (typeof value === "string") return value;
    try { return JSON.stringify(value); } catch { return String(value); }
  }

  function nowTs() {
    const d = new Date();
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function appendEventToLastAssistant(messages, payload) {
    // 마지막 assistant 메시지 찾아서 events에 쌓기
    for (let i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === "assistant") {
        if (!Array.isArray(messages[i].events)) messages[i].events = [];
        messages[i].events.push({
          ts: nowTs(),
          text: formatEventMessage(payload),
          raw_json: extractEventJson(payload),
        });
        return;
      }
    }
  }


  async function clearMessages() {
    const previousChatSessionId = getChatSessionId();
    localStorage.removeItem(storageKey);
    renderMessages([]);
    chatThreadId = String(Date.now());
    localStorage.setItem(chatThreadStorageKey, chatThreadId);
    setStatus("cleared");
    try {
      const url = new URL(`${apiBase}/chat/dialogue`);
      url.searchParams.set("session_id", previousChatSessionId);
      await fetch(url.toString(), { method: "DELETE", headers: authHeaders() });
    } catch (err) {}
    try {
      await fetch(`${apiBase}/chat/context`, { method: "DELETE", headers: authHeaders() });
    } catch (err) {}
  }

  function tryParseJsonLike(value) {
    if (value == null) return null;
    if (typeof value === "object") return value;
    if (typeof value !== "string") return null;
    const text = value.trim();
    if (!text) return null;
    if (!(text.startsWith("{") || text.startsWith("["))) return null;
    try {
      return JSON.parse(text);
    } catch {
      return null;
    }
  }

  function extractEventJson(payload) {
    if (!payload || typeof payload !== "object") return null;
    if (payload.event === "tool_called") {
      return tryParseJsonLike(payload.arguments) || null;
    }
    if (payload.event === "tool_output") {
      return tryParseJsonLike(payload.output) || payload.output || null;
    }
    return null;
  }

  function renderJsonPrimitive(value) {
    if (value === null) return '<span class="json-null">null</span>';
    if (typeof value === "string") {
      return `<span class="json-string">"${escapeHtml(value)}"</span>`;
    }
    if (typeof value === "number") {
      return `<span class="json-number">${String(value)}</span>`;
    }
    if (typeof value === "boolean") {
      return `<span class="json-boolean">${String(value)}</span>`;
    }
    return `<span class="json-string">"${escapeHtml(toText(value))}"</span>`;
  }

  function renderJsonTree(value, key = null, depth = 0) {
    const keyHtml = key !== null ? `<span class="json-key">${escapeHtml(String(key))}:</span>` : "";
    if (depth > 12) {
      return `${keyHtml} <span class="json-type">[max depth]</span>`;
    }
    if (value === null || typeof value !== "object") {
      return `<div class="trace-json-node">${keyHtml} ${renderJsonPrimitive(value)}</div>`;
    }

    if (Array.isArray(value)) {
      const label = key !== null
        ? `${keyHtml} <span class="json-type">array(${value.length})</span>`
        : `<span class="json-type">array(${value.length})</span>`;
      const children = value
        .map((item, idx) => renderJsonTree(item, idx, depth + 1))
        .join("");
      return `<div class="trace-json-node"><details><summary>${label}</summary>${children}</details></div>`;
    }

    const entries = Object.entries(value);
    const label = key !== null
      ? `${keyHtml} <span class="json-type">object(${entries.length})</span>`
      : `<span class="json-type">object(${entries.length})</span>`;
    const children = entries
      .map(([childKey, childVal]) => renderJsonTree(childVal, childKey, depth + 1))
      .join("");
    return `<div class="trace-json-node"><details><summary>${label}</summary>${children}</details></div>`;
  }

  function formatEventMessage(payload) {
    const type = payload.event;
    if (type === "tool_called") {
      return `calling tool ${payload.tool || "unknown"}`.trim();
    }
    if (type === "tool_output") {
      return "tool output received";
    }
    if (type === "reasoning") {
      return "reasoning in progress...";
    }
    if (type === "error") {
      return `error ${toText(payload.message || "")}`.trim();
    }
    if (type === "message") {
      return "streaming response...";
    }
    if (type === "final") {
      return "final answer ready";
    }
    return `event ${type}`;
  }

  function containsAppendSuccess(value, depth = 0) {
    if (depth > 6 || value == null) return false;
    if (typeof value === "string") {
      const text = value.toLowerCase();
      if (text.includes('"status":"appended"') || text.includes('"status":"already_exists"')) {
        return true;
      }
      const parsed = tryParseJsonLike(value);
      if (parsed) return containsAppendSuccess(parsed, depth + 1);
      return false;
    }
    if (Array.isArray(value)) {
      return value.some((item) => containsAppendSuccess(item, depth + 1));
    }
    if (typeof value === "object") {
      const obj = value;
      const status = String(obj.status || "").toLowerCase();
      if (status === "appended" || status === "already_exists") return true;
      return Object.values(obj).some((item) => containsAppendSuccess(item, depth + 1));
    }
    return false;
  }

  function maybeAutoRefreshOnAppend(payload) {
    if (pendingAutoRefresh) return;
    if (!payload || payload.event !== "tool_output") return;
    if (!containsAppendSuccess(payload.output)) return;
    pendingAutoRefresh = true;
    setStatus("chart appended. refreshing dashboard...");
    setTimeout(() => {
      try {
        if (window.parent && window.parent.location) {
          window.parent.location.reload();
          return;
        }
      } catch (err) {}
      window.location.reload();
    }, 900);
  }

  function formatChartLabel(chartId, chartName) {
    if (chartId && chartName) {
      return `id=${chartId}, name=${chartName}`;
    }
    if (chartName) {
      return `name=${chartName}`;
    }
    if (chartId) {
      return `id=${chartId}`;
    }
    return "";
  }

  async function fetchContextLabel() {
    if (dashboardId) {
      try {
        const res = await fetch(
          `${apiBase}/superset/charts/active?dashboard_id=${encodeURIComponent(dashboardId)}`,
          { headers: authHeaders() }
        );
        if (res.ok) {
          const data = await res.json();
          const activeCharts = data && Array.isArray(data.active_charts) ? data.active_charts : [];
          const selected =
            activeCharts.find((chart) => chart && chart.interaction) ||
            activeCharts[0] ||
            null;
          const activeTab = data && data.active_tab ? data.active_tab : null;
          const tabName = activeTab && activeTab.name ? String(activeTab.name) : "Active tab";
          if (selected && selected.slice_id) {
            return `Context: ${tabName} (${activeCharts.length} charts), focus ${formatChartLabel(selected.slice_id, selected.name || null)}\n`;
          }
          if (activeCharts.length > 0) {
            return `Context: ${tabName} (${activeCharts.length} charts)\n`;
          }
        }
      } catch (err) {}
    }
    try {
      const url = new URL(`${apiBase}/chat/context/latest`);
      const res = await fetch(url.toString(), { headers: authHeaders() });
      if (!res.ok) return "";
      const data = await res.json();
      if (!data || !data.context) {
        return "";
      }
      const activeContext = data.context.active_context;
      const activeCharts =
        activeContext && Array.isArray(activeContext.active_charts)
          ? activeContext.active_charts
          : [];
      if (!activeCharts.length) {
        return "";
      }
      const tabName =
        activeContext && activeContext.active_tab && activeContext.active_tab.name
          ? String(activeContext.active_tab.name)
          : "Active tab";
      return `Context: ${tabName} (${activeCharts.length} charts)\n`;
    } catch (err) {
      return "";
    }
  }

  async function sendMessage() {
    if (isStreaming) return;
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";

    const messages = loadMessages();
    messages.push({ role: "user", content: text });
    messages.push({ role: "assistant", content: "", events: [], is_loading: true });
    saveMessages(messages);
    renderMessages(messages);

    setStatus("sending...");
    try {
      setStreamingState(true);
      currentController = new AbortController();
      const localHistory = messages.slice(0, -2).map((msg) => ({
        role: String(msg.role || "user"),
        content: String(msg.content || ""),
      }));
      const history = localHistory.slice(-20);
      const response = await fetch(`${apiBase}/chat/stream`, {
        method: "POST",
        headers: authHeaders({ "Content-Type": "application/json" }),
        signal: currentController.signal,
        body: JSON.stringify({
          session_id: getChatSessionId(),
          user_id: userId,
          message: text,
          history: history,
          superset_username: supersetUsername || null,
          superset_password: supersetPassword || null,
          agent_model: agentModel || null,
          debug: true,
        }),
      });
      if (!response.ok || !response.body) {
        throw new Error(`HTTP ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let lastAnswer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";
        for (const part of parts) {
          const lines = part.split("\n").filter(Boolean);
          const dataLines = lines
            .filter((line) => line.startsWith("data:"))
            .map((line) => line.slice(5).trim())
            .join("");
          if (!dataLines) continue;
          try {
            const payload = JSON.parse(dataLines);
            if (payload.event) {
              if (payload.event !== "message") {
                appendEventToLastAssistant(messages, payload);
                maybeAutoRefreshOnAppend(payload);
                if (payload.event !== "reasoning") {
                  saveMessages(messages);
                }
                renderMessages(messages);
              }
            }
            if (payload.event === "message") {
              lastAnswer = payload.text || "";
              messages[messages.length - 1].content = lastAnswer;
              saveMessages(messages);
              renderMessages(messages);
            } else if (payload.event === "final") {
              lastAnswer = payload.answer || lastAnswer || "No answer.";
              const prefix = await fetchContextLabel();
              messages[messages.length - 1].content = `${prefix}${lastAnswer}`;
              messages[messages.length - 1].is_loading = false;
              saveMessages(messages);
              renderMessages(messages);
              setStatus("ready");
              setStreamingState(false);
              currentController = null;
            }
          } catch (err) {}
        }
      }
    } catch (err) {
      if (err && err.name === "AbortError") {
        appendEventToLastAssistant(messages, { event: "error", message: "interrupted by user" });
        messages[messages.length - 1].is_loading = false;
        saveMessages(messages);
        renderMessages(messages);
        setStatus("interrupted");
      } else {
        messages[messages.length - 1].content = `FastAPI error: ${err}`;
        messages[messages.length - 1].is_loading = false;
        saveMessages(messages);
        renderMessages(messages);
        setStatus("error");
      }
    } finally {
      setStreamingState(false);
      currentController = null;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  stopBtn.addEventListener("click", () => {
    if (currentController) {
      currentController.abort();
    }
  });
  clearBtn.addEventListener("click", clearMessages);
  function autoResizeInput() {
    inputEl.style.height = "auto";
    inputEl.style.height = `${Math.min(inputEl.scrollHeight, 240)}px`;
  }

  inputEl.addEventListener("input", autoResizeInput);
  autoResizeInput();

  inputEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      sendMessage();
    }
  });

  renderMessages(loadMessages());
</script>
