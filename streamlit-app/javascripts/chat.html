<div id="{{CHAT_CONTAINER_ID}}" class="chat-root">
  <style>
    html, body {
      background: #262731;
    }
    .chat-root {
      font-family: sans-serif;
      color: #fff;
      background: #262731;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #262731;
      padding: 6px 0 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex: 0 0 auto;
    }
    .chat-title {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 20px;
      color: #ffffff;
    }
    .chat-input-row {
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }
    .chat-input {
      flex: 1;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #ffffff;
      color: #000000;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 16px;
      line-height: 1.35;
      resize: vertical;
      min-height: 44px;
      max-height: 240px;
      overflow: auto;
    }
    .chat-send {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #1f2937;
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
    }
    .chat-clear {
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #111827;
      color: #cbd5f5;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .chat-status {
      margin-top: 6px;
      font-size: 13px;
      color: #5a5d62;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .chat-panel {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 8px;
      background: #262731;
      margin-top: 10px;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .scroller {
      overflow: auto;
      height: 100vh;
      display: flex;
      flex-direction: column-reverse;
      overflow-anchor: auto !important;
      height: auto;         /* 기존 80vh 제거 */
      flex: 1 1 auto;
      min-height: 0;
    }
    .scroller-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px 0 12px 0;
    }
    .meta {
      display: flex;
      align-items: center;
      margin: 0 2px -6px 2px;
      opacity: 0.9;
    }
    .meta.user {
      justify-content: flex-end;
    }
    .meta.assistant {
      justify-content: flex-start;
    }
    .avatar {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transform: translateZ(0);
    }
    .bubble {
      padding: 10px 12px;
      border-radius: 16px;
      max-width: 92%;
      line-height: 1.35;
      font-size: 1.02rem;
      white-space: pre-wrap;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }
    .bubble.user {
      margin-left: auto;
      background: rgba(0, 140, 255, 0.22);
      border: 1px solid rgba(0, 140, 255, 0.35);
    }
    .bubble.assistant {
      margin-right: auto;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .trace-details {
      margin-top: 4px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      padding: 4px 6px;
    }
    .trace-details summary {
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5f5;
      font-size: 13px;
      user-select: none;
      padding: 2px 0;            /* summary 자체 패딩 추가(작게) */
      line-height: 1.2;
    }
    .trace-details summary::-webkit-details-marker { display: none; }

    .trace-details .spinner {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #93c5fd; /* 파란색 */
      animation: spin 0.8s linear infinite;
    }

    .trace-details[open] summary {
      margin-bottom: 2px;
    }
    

    .trace-list {
      margin: 2px 0 0;
      padding-left: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .trace-item {
      font-size: 12px;
      color: rgba(255,255,255,0.85);
      line-height: 1.25;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .trace-ts {
      color: rgba(255,255,255,0.45);
      margin-right: 6px;
    }
  </style>
  <div class="chat-header">
    <div class="chat-title">Chat</div>
    <div class="chat-input-row">
      <textarea class="chat-input" rows="1" placeholder="Ask about what you see..."></textarea>
      <button class="chat-send">Send</button>
      <button class="chat-clear">Clear Chat</button>
    </div>
    <div class="chat-status">ready</div>
  </div>
  <div class="chat-panel">
    <div class="scroller">
      <div class="scroller-content"></div>
    </div>
  </div>
</div>
<script>
  const root = document.getElementById("{{CHAT_CONTAINER_ID}}");
  const inputEl = root.querySelector(".chat-input");
  const sendBtn = root.querySelector(".chat-send");
  const clearBtn = root.querySelector(".chat-clear");
  const statusEl = root.querySelector(".chat-status");
  const listEl = root.querySelector(".scroller-content");

  const apiBase = "{{FASTAPI_PUBLIC_URL}}";
  const sessionId = "{{SESSION_ID}}";
  const userId = "{{USER_ID}}";
  const dashboardId = "{{DASHBOARD_ID}}";
  const storageKey = dashboardId
    ? `chat_messages_${dashboardId}`
    : "chat_messages_default";
  const chartStorageKey = `chat_active_chart_${sessionId}`;
  const logStorageKey = dashboardId
    ? `superset-log-last-id-${dashboardId}`
    : null;
  const chartMap = new Map();
  let activeChartId = null;
  let activeChartName = null;

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  function loadMessages() {
    try {
      const raw = localStorage.getItem(storageKey);
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function saveMessages(messages) {
    localStorage.setItem(storageKey, JSON.stringify(messages));
  }

  function renderMessages(messages) {
    listEl.innerHTML = "";
    const recent = messages.slice(-80);

    for (const msg of recent) {
      const role = msg.role === "user" ? "user" : "assistant";
      const icon = role === "user" ? "🧑" : "🤖";

      const meta = document.createElement("div");
      meta.className = `meta ${role}`;
      meta.innerHTML = `<span class="avatar">${icon}</span>`;

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;

      if (role === "assistant") {
        const safeText = escapeHtml(msg.content || "");
        const events = Array.isArray(msg.events) ? msg.events : [];
        const isLoading = !!msg.is_loading;

        let traceHtml = "";
        if (events.length) {
          const summaryLabel = isLoading
            ? `Reasoning Trace (${events.length})`
            : `Reasoning Trace (${events.length})`;

          const items = events
            .map((e) => {
              const ts = e.ts ? `<span class="trace-ts">${escapeHtml(e.ts)}</span>` : "";
              return `<li class="trace-item">${ts}${escapeHtml(e.text || "")}</li>`;
            })
            .join("");

          traceHtml = `
            <details class="trace-details" ${isLoading ? "open" : ""}>
              <summary>
                ${isLoading ? `<span class="spinner"></span>` : ""}
                <span>${escapeHtml(summaryLabel)}</span>
              </summary>
              <ol class="trace-list">${items}</ol>
            </details>
          `;
        } else if (isLoading) {
          traceHtml = `
            <details class="trace-details" open>
              <summary>
                <span class="spinner"></span>
                <span>Running...</span>
              </summary>
            </details>
          `;
        }

        bubble.innerHTML = `${safeText || ""}${traceHtml}`;
      } else {
        bubble.innerHTML = escapeHtml(msg.content || "");
      }

      listEl.appendChild(meta);
      listEl.appendChild(bubble);
    }
  }

  function toText(value) {
    if (value == null) return "";
    if (typeof value === "string") return value;
    try { return JSON.stringify(value); } catch { return String(value); }
  }

  function nowTs() {
    const d = new Date();
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function appendEventToLastAssistant(messages, payload) {
    // 마지막 assistant 메시지 찾아서 events에 쌓기
    for (let i = messages.length - 1; i >= 0; i--) {
      if (messages[i].role === "assistant") {
        if (!Array.isArray(messages[i].events)) messages[i].events = [];
        messages[i].events.push({ ts: nowTs(), text: formatEventMessage(payload) });
        return;
      }
    }
  }


  async function clearMessages() {
    localStorage.removeItem(storageKey);
    renderMessages([]);
    setStatus("cleared");
    try {
      const url = new URL(`${apiBase}/chat/dialogue`);
      url.searchParams.set("session_id", sessionId);
      await fetch(url.toString(), { method: "DELETE" });
    } catch (err) {}
    try {
      await fetch(`${apiBase}/chat/context`, { method: "DELETE" });
    } catch (err) {}
  }

  function truncate(value, maxLen) {
    const text = toText(value);
    if (text.length <= maxLen) return text;
    return `${text.slice(0, maxLen)}...`;
  }

  function formatEventMessage(payload) {
    const type = payload.event;
    if (type === "tool_called") {
      const args = payload.arguments ? truncate(payload.arguments, 120) : "";
      return `calling tool ${payload.tool || "unknown"} ${args}`.trim();
    }
    if (type === "tool_output") {
      return `tool output received ${truncate(payload.output, 120)}`.trim();
    }
    if (type === "reasoning") {
      return "reasoning in progress...";
    }
    if (type === "error") {
      return `error ${truncate(payload.message, 160)}`.trim();
    }
    if (type === "message") {
      return "streaming response...";
    }
    if (type === "final") {
      return "final answer ready";
    }
    return `event ${type}`;
  }

  function formatChartLabel(chartId, chartName) {
    if (chartId && chartName) {
      return `id=${chartId}, name=${chartName}`;
    }
    if (chartName) {
      return `name=${chartName}`;
    }
    if (chartId) {
      return `id=${chartId}`;
    }
    return "";
  }

  async function fetchContextLabel() {
    if (activeChartId && chartMap.has(String(activeChartId))) {
      const chartName = chartMap.get(String(activeChartId));
      return `Using activated charts (${formatChartLabel(activeChartId, chartName)})\n`;
    }
    if (activeChartName) {
      return `Using activated charts (${formatChartLabel(activeChartId, activeChartName)})\n`;
    }
    if (activeChartId) {
      return `Using activated charts (${formatChartLabel(activeChartId, null)})\n`;
    }
    if (dashboardId) {
      try {
        const res = await fetch(
          `${apiBase}/superset/charts/active?dashboard_id=${encodeURIComponent(dashboardId)}`
        );
        if (res.ok) {
          const data = await res.json();
          if (data && data.chart_name) {
            return `Using activated charts (${formatChartLabel(data.slice_id, data.chart_name)})\n`;
          }
          if (data && data.slice_id) {
            return `Using activated charts (${formatChartLabel(data.slice_id, null)})\n`;
          }
        }
      } catch (err) {}
    }
    try {
      const url = new URL(`${apiBase}/chat/context/latest`);
      const res = await fetch(url.toString());
      if (!res.ok) return "";
      const data = await res.json();
      if (!data || !data.context) {
        return "No context available yet.\n";
      }
      const chartId = data.context.chart_id;
      if (!chartId) {
        return "No context available yet.\n";
      }
      const chartName = chartMap.get(String(chartId));
      if (chartName) {
        return `Using activated charts (${formatChartLabel(chartId, chartName)})\n`;
      }
      return `Using activated charts (${formatChartLabel(chartId, null)})\n`;
    } catch (err) {
      return "No context available yet.\n";
    }
  }

  async function loadChartMap() {
    if (!dashboardId) return;
    try {
      const res = await fetch(`${apiBase}/superset/dashboards/${dashboardId}/charts`);
      if (!res.ok) return;
      const data = await res.json();
      const charts = data && data.charts ? data.charts : [];
      charts.forEach((chart) => {
        const sliceId = chart.slice_id || chart.chart_id;
        if (!sliceId) return;
        chartMap.set(String(sliceId), chart.name || "");
      });
    } catch (err) {}
  }

  function loadActiveChart() {
    try {
      const raw = localStorage.getItem(chartStorageKey);
      if (!raw) return;
      const data = JSON.parse(raw);
      activeChartId = data.chart_id ?? null;
      activeChartName = data.chart_name ?? null;
    } catch (err) {}
  }

  function saveActiveChart() {
    localStorage.setItem(
      chartStorageKey,
      JSON.stringify({ chart_id: activeChartId, chart_name: activeChartName })
    );
  }

  function startLogListener() {
    if (!dashboardId || !window.EventSource) return;
    const lastId = logStorageKey ? Number(localStorage.getItem(logStorageKey) || "0") : 0;
    const logUrl = `${apiBase}/superset/logs/stream?limit=50&poll_interval_sec=1.0&dashboard_id=${dashboardId}&last_id=${lastId}`;
    const source = new EventSource(logUrl);
    source.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (!data) return;
        if (data.superset_log_id && logStorageKey) {
          localStorage.setItem(logStorageKey, String(data.superset_log_id));
        }
        const sliceId = data.slice_id;
        if (!sliceId) return;
        activeChartId = Number(sliceId);
        const name = chartMap.get(String(sliceId));
        activeChartName = name || `Chart ${sliceId}`;
        saveActiveChart();
      } catch (err) {}
    };
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";

    const messages = loadMessages();
    messages.push({ role: "user", content: text });
    messages.push({ role: "assistant", content: "", events: [], is_loading: true });
    saveMessages(messages);
    renderMessages(messages);

    setStatus("sending...");
    try {
      const history = messages.slice(0, -2).map((msg) => ({
        role: String(msg.role || "user"),
        content: String(msg.content || ""),
      }));
      const response = await fetch(`${apiBase}/chat/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          session_id: sessionId,
          user_id: userId,
          message: text,
          history: history.slice(-20),
          active_chart_id: activeChartId,
          active_chart_name: activeChartName,
          debug: true,
        }),
      });
      if (!response.ok || !response.body) {
        throw new Error(`HTTP ${response.status}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let lastAnswer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n\n");
        buffer = parts.pop() || "";
        for (const part of parts) {
          const lines = part.split("\n").filter(Boolean);
          const dataLines = lines
            .filter((line) => line.startsWith("data:"))
            .map((line) => line.slice(5).trim())
            .join("");
          if (!dataLines) continue;
          try {
            const payload = JSON.parse(dataLines);
            if (payload.event) {
              if (payload.event !== "message") {
                appendEventToLastAssistant(messages, payload);
                if (payload.event !== "reasoning") {
                  saveMessages(messages);
                }
                renderMessages(messages);
              }
            }
            if (payload.event === "message") {
              lastAnswer = payload.text || "";
              messages[messages.length - 1].content = lastAnswer;
              saveMessages(messages);
              renderMessages(messages);
            } else if (payload.event === "final") {
              lastAnswer = payload.answer || lastAnswer || "No answer.";
              const prefix = await fetchContextLabel();
              messages[messages.length - 1].content = `${prefix}${lastAnswer}`;
              messages[messages.length - 1].is_loading = false;
              saveMessages(messages);
              renderMessages(messages);
              setStatus("ready");
            }
          } catch (err) {}
        }
      }
    } catch (err) {
      messages[messages.length - 1].content = `FastAPI error: ${err}`;
      messages[messages.length - 1].is_loading = false;
      saveMessages(messages);
      renderMessages(messages);
      setStatus("error");
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  clearBtn.addEventListener("click", clearMessages);
  function autoResizeInput() {
    inputEl.style.height = "auto";
    inputEl.style.height = `${Math.min(inputEl.scrollHeight, 240)}px`;
  }

  inputEl.addEventListener("input", autoResizeInput);
  autoResizeInput();

  inputEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      sendMessage();
    }
  });

  loadActiveChart();
  loadChartMap().then(startLogListener);
  renderMessages(loadMessages());
</script>
