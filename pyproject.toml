[project]
name = "agent4olap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.9.18",
    "fastapi[standard]>=0.115.6",
    "cube-dbt>=0.6.2",
    "dbt-core>=1.10.11",
    "dbt-duckdb>=1.9.6",
    "dbt-metricflow>=0.10.1",
    "faker>=37.11.0",
    "ipycytoscape>=1.3.3",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "langchain>=0.3.27",
    "langchain-community>=0.3.29",
    "langchain-mcp-adapters>=0.1.10",
    "langchain-openai>=0.3.33",
    "langgraph>=0.6.7",
    "lmdb>=1.7.3",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "mcp>=1.14.1",
    "openai>=1.109.0",
    "pandas>=2.3.2",
    "plotly>=6.3.1",
    "networkx>=3.4.2",
    "python-dotenv>=1.1.1",
    "seaborn>=0.13.2",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.55.2",
    "vllm==0.10.2",
    "uvicorn>=0.32.1",
    "openai-agents>=0.3.3",
    "streamlit>=1.52.1",
    "requests>=2.32.5",
    "streamlit-agraph>=0.0.45",
    "psycopg2-binary>=2.9.11",
]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "vllm-0102"
url  = "https://wheels.vllm.ai/0.10.2/"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
